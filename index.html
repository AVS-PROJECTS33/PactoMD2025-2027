    "title": "Artículo 26.- Enfermedad y Bajas Médicas.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 26.- Enfermedad y Bajas Médicas.</p><p class=\"parrafo-normal\">En caso de baja por enfermedad o accidente de trabajo debidamente acreditado, el personal percibirá el importe íntegro de su salario correspondiente al mes anterior a la baja, incluidas las comisiones que en ese mes se hubiesen podido percibir y que se reflejan en la base reguladora del indicado mes, abonando así la empresa las posibles diferencias existentes entre esta y la prestación por incapacidad temporal, todo ello aunque hayan sido sustituidos y por el tiempo de duración de la citada incapacidad temporal.</p><p class=\"parrafo-normal\">Los periodos de baja por incapacidad temporal deben entenderse $y/o$ asimilarse a periodo de trabajo efectivo. En atención a ellos tales periodos deberán considerarse siempre para el cumplimiento de la jornada de trabajo máxima establecida en el Art. 15 del presente Acuerdo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 27.- Situación de embarazo.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 27.- Situación de embarazo.</p><p class=\"parrafo-normal\">La trabajadora que, una vez comunicada a la empresa la situación de embarazo permanezca en activo y le coincida el disfrute de un periodo vacacional o de compensación de horas de exceso podrá solicitar que el mismo se le suspenda y disfrutarlo posteriormente tras el permiso de nacimiento de hijo/a, junto con el resto de periodos vacacionales que puedan coincidir durante la situación de riesgo para el embarazo o de baja de maternidad.</p><p class=\"parrafo-normal\">Para todas las trabajadoras embarazadas, desde la semana 14 de gestación, se le garantiza la posibilidad de retribuir ocho horas de salario si bien prestará únicamente seis horas de trabajo efectivo cada día (en el caso de jornadas inferiores a 40 horas semanales, se realizará la parte proporcional). Para el cálculo del plus de asistencia esta ausencia $(6\\times8)$ se considerará como hora de presencia.</p><p class=\"parrafo-normal\">De la semana 18 a la semana 20 de gestación la trabajadora estará en situación de permiso retribuido hasta que se le conceda el riesgo por embarazo en la semana 20 de gestación. La trabajadora deberá presentar a Recursos Humanos un informe médico donde indique el día en que comienza la semana 18 de gestación.</p><p class=\"parrafo-normal\">Las situaciones anteriores no resultarán de aplicación a las trabajadoras embarazadas, en situación de baja por embarazo de riesgo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 28.- Ayudas Sociales.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 28.- Ayudas Sociales.</p><p class=\"parrafo-normal\">Se establecen las siguientes Ayudas Sociales:</p><p class=\"articulo-titulo\">Artículo 28.1.- Ayuda por Matrimonio o Pareja de hecho.</p><p class=\"parrafo-normal\">Se establece una ayuda por matrimonio o por la constitución de una pareja de hecho legalmente inscrita en el registro oficial establecida al efecto por un importe de 100 € brutos en un único pago.</p><p class=\"articulo-titulo\">Artículo 28.2.- Ayuda por Nacimiento.</p><p class=\"parrafo-normal\">Se establece una ayuda por nacimiento de descendientes de 450€ brutos en un único pago más una canastilla.</p><p class=\"articulo-titulo\">Artículo 28.3.- Ayuda por adopción internacional</p><p class=\"parrafo-normal\">En este concepto la Empresa abonará hasta un máximo de 600€ brutos para contribuir al coste de un billete de avión (ida y vuelta) u otros gastos derivados de la adopción internacional de la persona trabajadora que necesite viajar al extranjero a tramitar una adopción internacional. Los gastos incurridos deberán ser debidamente justificados.</p><p class=\"parrafo-normal\">Si ambos progenitores trabajan en el grupo de empresas de Inditex de Tordera-Palafolls, se le abonará al de mayor antigüedad en el Grupo.</p><p class=\"articulo-titulo\">Artículo 28.4.- Ayuda discapacidad.</p><p class=\"parrafo-normal\">Se establece una ayuda de 200 € brutos mensuales en 12 pagas por cada familiar de primer grado de consanguinidad o afinidad a cargo del trabajador o trabajadora (esto es, que figuren a su cargo en la declaración de IRPF) con una discapacidad igual o superior al 33% que haya sido declarada por la Administración Pública competente en la materia.</p><p class=\"articulo-titulo\">Artículo 28.5.- Ayuda Guardería.</p><p class=\"parrafo-normal\">Se establece una ayuda por guardería a través del ticket guardería de hasta 170 € brutos mensuales para el personal que cumpla con los siguientes requisitos:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp;•&nbsp;Destinado a niños/niñas de 0 a 3 años que asistan a la guardería.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp;•&nbsp;Se abonará mensualmente mientras asista a la guardería. Para el caso en el que la persona reciba una subvención de la administración pública por el&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;hecho de que su hijo/hija asista a una guardería pública o privada, el importe a abonar por la empresa será la diferencia entre la subvención hasta los 170&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;euros.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp;•&nbsp;El pago no pasará por nómina, sino que se gestionará de manera externa, salvo que se abone a través de la retribución flexible en cuyo caso se abonará y&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;cotizará como legalmente corresponda. La guardería lo descontará del importe total que se le cobre al trabajador o trabajadora.</p><p class=\"parrafo-normal\">Las condiciones para percibir esta ayuda son las siguientes:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; •&nbsp;Cada hijo/hija dará lugar a una única ayuda por cada concepto, con independencia de que ambos padres trabajen en la empresa.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; •&nbsp;Se aplicará a partir de los 6 meses de antigüedad.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; •&nbsp;Si ambos progenitores trabajan en el grupo de empresas de Inditex de Tordera-Palafolls, se le abonará al de mayor antigüedad en el Grupo.</p><p class=\"articulo-titulo\">Artículo 28.6.- Ayuda para material escolar.</p><p class=\"parrafo-normal\">Se establece una ayuda para material escolar de 200 euros brutos para el personal que cumpla con los siguientes requisitos:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp;•&nbsp;Que tenga hijos/hijas en edad escolar desde 3 años hasta que el menor cumpla los 16 años y esté cursando estudios de enseñanza obligatoria.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Se abonará en un único pago en la mensualidad de julio.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Se deberá aportar la justificación que acredite que el menor está cursando estudios obligatorios. Dicha justificación se entregará a la empresa una única&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;vez, aunque en determinadas situaciones la empresa se reserva el derecho de poder pedir nuevamente la justificación correspondiente.</p><p class=\"parrafo-normal\">Las condiciones para percibir esta ayuda son las siguientes:</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Cada hijo/hija dará lugar a una única ayuda por cada concepto, con independencia de que ambos padres trabajen en la empresa.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Se aplicará a partir de los 6 meses de antigüedad.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp;&nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Si ambos progenitores trabajan en el grupo de empresas de Inditex de Tordera-Palafolls, se le abonará al de mayor antigüedad en el Grupo.</p><p class=\"articulo-titulo\">Artículo 28.7.- Ayuda para estudios intermedios:</p><p class=\"parrafo-normal\">Se acuerda una ayuda para estudios de grado medio, superior y bachiller de las propias personas trabajadoras y/o hijos/as hasta los 23 años por importe de 300 euros brutos anuales con la finalidad de sufragar el coste de la realización de los citados estudios, en las condiciones siguientes:</p><p class=\"parrafo-normal\"><font color=\"#9ca3af\">&nbsp; &nbsp; &nbsp;&nbsp;</font><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Para tener derecho a la solicitud de esta ayuda la persona trabajadora debe estar de alta en la empresa en el momento del cobro de la nómina de&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; octubre o bien en noviembre para aquellos casos en los que no tengan plaza asignada en el mes anterior.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp;&nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Se aplicará a partir de los 6 meses de antigüedad en la empresa.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Deberá entregar la solicitud con la matrícula y el justificante de pago de la misma antes del 30 de septiembre. En caso de que no se pueda presentar el&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;documento de la matrícula, se podrán aceptar otros documentos oficiales que justifiquen la continuidad de los estudios por la persona.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp;•&nbsp;Asimismo, la persona trabajadora deberá justificar un aprovechamiento suficiente de los estudios (propios y/o de los hijos/las hijas) a partir del segundo&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;año que se matricula para poder seguir percibiendo la misma. Se entiende aprovechamiento suficiente haber aprobado el 70% de los créditos en los&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;que se haya matriculado la persona (propios y/o de los hijos/las hijas).</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;Si ambos padres trabajan en el grupo de empresas de Inditex de Tordera- Palafolls, se le abonará al de mayor antigüedad en el Grupo.</p><p class=\"articulo-titulo\">Artículo 28.8.- Ayuda para estudios universitarios:</p><p class=\"parrafo-normal\">Se acuerda una ayuda para estudios universitarios de las propias personas trabajadoras y/o hijos/as hasta los 23 años por importe de 400 euros brutos anuales con la finalidad de sufragar el coste de la realización de los citados estudios, en las condiciones siguientes:</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Para tener derecho a la solicitud de esta ayuda la persona trabajadora debe estar de alta en la empresa en el momento del cobro de la nómina de&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; octubre o bien en noviembre para aquellos casos en los que no tengan plaza asignada en el mes anterior.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Se aplicará a partir de los 6 meses de antigüedad en la empresa.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Deberá entregar la solicitud con la matrícula y justificante del pago de la misma antes del 30 de septiembre. En caso de que no se pueda presentar el&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; documento de la matrícula, se podrán aceptar otros documentos oficiales que justifiquen la continuidad de los estudios por la persona.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Asimismo, la persona trabajadora deberá justificar un aprovechamiento suficiente de los estudios (propios y/o de los hijos/las hijas) a partir del&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;segundo año que se matricula para poder seguir percibiendo la misma. Se entiende aprovechamiento suficiente haber aprobado el 70% de los&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;créditos en los que se haya matriculado la persona (propios y/o de los hijos/las hijas).</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;Si ambos padres trabajan en el grupo de empresas de Inditex de Tordera- Palafolls, se le abonará al de mayor antigüedad en el Grupo.</p><p class=\"parrafo-normal\">Para ser perceptor de esas Ayudas Sociales reflejadas en este artículo se deberá acreditar debidamente cada uno de los hechos causantes de las mismas.</p><p class=\"articulo-titulo\">Artículo 28.9.- Acceso a Picnic / Comedor.</p><p class=\"parrafo-normal\">El personal adscrito a este Acuerdo tendrá acceso a una subvención de comida al día bonificada por la empresa a escoger entre servicio de comedor o menú picnic.</p><p class=\"parrafo-normal\">Con carácter general solo se podrá acceder a un servicio subvencionado por día, a elección de la persona, y para poder consumirlo para el desayuno o la comida. En el caso de solicitar más de uno, la persona abonará la totalidad del coste de la segunda petición. No obstante, se acuerda que la empresa asumirá la segunda subvención para aquellas personas que se les solicite la realización de horas extraordinarias en el mismo día y esta petición conlleve quedarse a comer para continuar con las horas después de comer.</p><p class=\"parrafo-normal\">En el caso de solicitar un menú picnic a cargo de la empresa se realizará conforme al siguiente sistema:</p><p class=\"lista-letra\">• El personal adscrito a este acuerdo podrá escoger un picnic que consiste en:</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; -Picnic 1 grande MDL&nbsp;</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; -Picnic 2 combinado&nbsp;</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;-Picnic 3 viernes&nbsp;</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- Picnic Hardvard MDL&nbsp;</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; - Picnic 6.- Desayuno con subvención;</p><p class=\"lista-letra\">• El personal dispondrá del menú de picnics semanal a partir de las 17h de cada viernes.</p><p class=\"lista-letra\">• La recogida del picnic comida será en las salas de descanso del centro logístico (se separarán por sección) de lunes a viernes en los siguientes horarios, 10h y 13h pudiéndolo solicitar hasta las 9h del mismo día.</p><p class=\"lista-letra\">• La recogida del picnic desayuno será en las salas de descanso del centro logístico (se separarán por sección) de lunes a viernes en el primer descanso pudiéndolo solicitar hasta las 7h del mismo día.</p><p class=\"lista-letra\">• Para el personal que realice horario nocturno, deberá solicitar el desayuno con subvención, cuya recogida será en la sala de descanso general del centro logístico solicitándolo el jueves anterior.</p><p class=\"lista-letra\">• La persona que pida picnic y finalmente no lo retire del lugar en el que se le haya depositado, sin motivo justificado y repitiéndose este hecho en 3 ocasiones durante un año en curso, se le bloqueará el acceso al picnic durante toda una semana después de la tercera falta. Así como la persona reincidente que se haya quedado 2 semanas sin picnic, por habérselo dejado previamente 6 veces, a partir séptimo picnic que se olvide o lo solicite sin haber venido a trabajar, se le descontará el importe de los picnics no retirados en la nómina del mes siguiente.&nbsp;<span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">Asimismo, solamente se podrá solicitar picnic los días en los que la persona tenga presencia efectiva en el centro para prestar servicios.</p><p class=\"lista-letra\"><span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\"><br></p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;Ruta de acceso: INET / TORDERA/COMEDOR.</p><p class=\"parrafo-normal\">El precio del menú subvencionado y del take away será de 1,2 euros y el precio del servicio de picnic está subvencionado por la empresa siendo coste cero para la persona trabajadora.</p><p class=\"parrafo-normal\">Se especifica que en el servicio de comedor como take away, la persona trabajadora tendrá la opción de mayor cantidad de primeros y guarnición. En ambos casos se dará opción a: entrante, primer plato, segundo plato, bebida y postre.</p><p class=\"parrafo-normal\">Para cualquier incidencia relacionada con los picnics debéis dirigiros al correo de RRHH:</p><p class=\"parrafo-normal\">rrhhmassimoduttilogistica@massimodutti.com para tener constancia y remitirlo al comedor para buscar una solución.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 29.- Affinity Card.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 29.- Affinity Card.</p><p class=\"parrafo-normal\">Todos los empleados que cumplan los requisitos para ello podrán solicitar la tarjeta de compra Affinity Card, lo que les permitirá un descuento en compras realizadas en tiendas del Grupo Inditex. En caso de excedencia la tarjeta de Affinity Card quedará suspendida durante el período de la misma, salvo en el supuesto de excedencias voluntarias por cuidado de hijo/hija inferiores a 4 meses de duración.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 30.- Cesta de Navidad.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 30.- Cesta de Navidad.</p><p class=\"parrafo-normal\">Todas las personas adscritas a este Acuerdo que figuren en situación de alta en la empresa el día 30 de noviembre, recibirán en el mes de diciembre una cesta de Navidad.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 31.- Retribución Flexible.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 31.- Retribución Flexible.</p><p class=\"parrafo-normal\">El personal tendrá la posibilidad de acogerse al sistema retributivo denominado Retribución Flexible, siempre que se mantenga la normativa fiscal que autoriza a ello.</p><p class=\"parrafo-normal\">La empresa llevará a cabo las campañas informativas que resulten necesarias para que el personal pueda beneficiarse de este sistema.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 32.- Fisioterapeuta.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 32.- Fisioterapeuta.</p><p class=\"parrafo-normal\">Cuando el personal asista al Fisioterapeuta en las clínicas con las que la compañía haya concertado la asistencia, la empresa asumirá el 75% del coste del servicio, con un máximo de 12 sesiones anuales. Para ello, el trabajador o trabajadora deberá preavisar a RRHH a través de la INET de las sesiones de fisioterapeuta que se van a realizar con cargo a lo regulado en el presente artículo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 33.-Reconocimientos Médicos.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 33.-Reconocimientos Médicos.</p><p class=\"parrafo-normal\">El tiempo empleado en la realización del reconocimiento médico de la empresa, así como el de la vacunación de la gripe, se computará como tiempo efectivo de trabajo, siempre que se realicen dentro del turno de trabajo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 34.- Póliza de Seguros.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 34.- Póliza de Seguros.</p><p class=\"parrafo-normal\">La Empresa tendrá concertado con una entidad aseguradora una póliza de seguros a favor de todos los empleados por la que se les garantiza una indemnización mínima de 40.000 euros en caso de muerte o de declaración de incapacidad permanente (total, absoluta o gran invalidez), siempre que tales contingencias sean derivadas de accidente, sea laboral o no.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 35.- Uniforme",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 35.- Uniforme</p><p class=\"parrafo-normal\">Se hará entrega del uniforme desde el inicio de la relación laboral, que consistirá en:</p><p class=\"lista-letra\">• Para el personal indefinido: 2 pantalones, 2 camisetas, 2 chaquetas y 1 chaleco (en el caso de coincidir con periodo invernal y hasta agotar existencias).</p><p class=\"lista-letra\">• Para el personal con contratos de duración inferior a 6 meses al año: 2 camisetas, 1 pantalón y 1 chaqueta en el caso de coincidir con el periodo invernal.</p><p class=\"lista-letra\">• Para el personal temporal: 2 camisetas, 1 pantalón.</p><p class=\"parrafo-normal\">Durante el mes de enero de cada año se realizará una entrega anual consistente en:</p><p class=\"lista-letra\">• Para el personal indefinido: 4 camisetas, 2 pantalones largos (con posibilidad de solicitar 2 cortos en caso de necesidad), 1 chaqueta y reposición de prendas.</p><p class=\"lista-letra\">• Para el personal con contratos de duración inferior a 6 meses: 2 camisetas, 1 pantalón y 1 chaqueta (en caso de coincidir con periodo invernal).</p><p class=\"parrafo-normal\">En el caso de una persona con contrato inferior a 6 meses acabe realizando más tiempo en el año puede solicitar las mudas restantes, así como dar opción de pantalón corto al personal cuyo periodo de contratación coincida con el periodo de verano. Y en todos los casos tendrán opción de sustitución por rotura o desgaste.</p><p class=\"parrafo-normal\">Para el año 2026 se excluirá la entrega de chaquetas en la reposición anual, teniendo en cuenta que se han entregado a finales de 2025 las chaquetas nuevas.</p><p class=\"parrafo-normal\">En el caso de solicitar prendas fuera de los periodos estipulados, se garantiza la reposición por rotura o desgaste, pero se solicitará la entrega de la prenda anterior.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 36.- Consulta podológica / calzado de seguridad.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 36.- Consulta podológica / calzado de seguridad.</p><p class=\"parrafo-normal\">El trabajador o la trabajadora que presente algún problema médico en los pies causado por el uso de calzado de seguridad solicitará visita al servicio médico. Tras dicha visita, si el facultativo/facultativa lo considera necesario, lo derivará a consulta podológica, y el coste de las plantillas, si fueran necesarias, relativas al uso del calzado de seguridad las asumiría la empresa, así como el coste de la consulta podológica, que se concertará fuera del turno y horario de la persona trabajadora. En el supuesto que la persona requiera de un calzado especial la empresa le facilitará el más adecuado.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "CAPITULO VI \"PERSONAL FIJO DISCONTINUO\".",
    "contentHtml": "<p class=\"articulo-titulo\">CAPITULO VI \"PERSONAL FIJO DISCONTINUO\".</p>\n<p class=\"parrafo-normal\">En el presente capítulo se recoge la aplicación concreta de determinadas materias reguladas en el presente Acuerdo al personal con contrato fijo discontinuo debido al carácter particular de este tipo de contrato</p>"
  },
  {
    "title": "Artículo 37- Condiciones Generales",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 37- Condiciones Generales</p><p class=\"parrafo-normal\">La contratación del personal con contrato fijo discontinuo se realiza en función de las necesidades productivas/organizativas del centro. Para cubrir las nuevas vacantes, la empresa valorará a las personas que hayan prestado servicios en Massimo Dutti Logística con anterioridad.</p><p class=\"articulo-titulo\">Artículo 37.1.- Llamamiento</p><p class=\"lista-letra\">• Preaviso: El llamamiento se realizará con 15 días naturales de preaviso a la fecha de incorporación.</p><p class=\"lista-letra\">• Medio de comunicación: Por correo electrónico, comunicando el horario de trabajo de cada persona para el periodo de actividad informado, siendo susceptible de modificación para futuros periodos.</p><p class=\"lista-letra\">• Plazo de respuesta: Las personas que hayan recibido el llamamiento dispondrán de un plazo de 48h a contar desde la recepción del correo electrónico para responder si acepta o no la incorporación. Si la empresa no recibiese contestación, se realizará un segundo llamamiento via llamada telefónica para recordarle que se debe responder en el plazo de las siguientes 48 horas. En caso de no tener respuesta en el plazo previsto, se entenderá que la persona no está interesada en la posición vacante y se considerará baja voluntaria.</p><p class=\"lista-letra\">• Orden de llamada: El criterio de llamada será por orden de antigüedad, y en caso de tener varias personas con la misma antigüedad, se procederá a realizar el Ilamamiento por orden del primer apellido.</p><p class=\"lista-letra\">• Plazos de incorporación: Aunque el periodo de llamamiento sea de 15 días, si la empresa necesitase una incorporación inmediata y la persona aceptara voluntariamente dicha propuesta, se incorporaria con carácter inmediato. El rechazo a la incorporación inmediata por parte de la persona trabajadora no da lugar a que no se incorpore cuando le corresponda, según los criterios fijados.</p><p class=\"lista-letra\">• Incorporación: En el supuesto que la persona no se incorpore en el periodo de Ilamamiento, se rescindiría el contrato laboral, salvo que la legislación vigente disponga otra cosa.</p><p class=\"lista-letra\">• Información a la RLPT: Se informará a la RLPT del personal incorporado, turnos e incidencias una vez realizado el llamamiento y de forma anual se entregará el orden de llamamiento actualizado.</p><p class=\"articulo-titulo\">Artículo 37.2.-Periodos extraordinarios</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;• Llamamiento extraordinario: Si fuese necesario realizar un llamamiento extraordinario o prolongar el llamamiento por razones organizativas y&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; productivas inesperadas, se pondrá en conocimiento de la RLPT y de las personas trabajadoras fijas discontinuas.</p><p class=\"lista-letra\">• Consolidación: Se consolidará en la duración anual de los llamamientos el período común coincidente en un período de tres años consecutivos, realizándose la consolidación en el cuarto año</p><p class=\"articulo-titulo\">Artículo 37.3.-Antigüedad</p><p class=\"parrafo-normal\">Será la fecha de incorporación en la empresa como fijo discontinuo.</p><p class=\"parrafo-normal\">Para la asignación de la categoría profesional, así como para optar a los variables, ayudas sociales, medidas de conciliación, beneficios y otros aspectos que recoge el Acuerdo de Condiciones de Massimo Dutti Logistica, se tendrá en cuenta la suma de los periodos de actividad.</p><p class=\"articulo-titulo\">Artículo 37.4.-Conversión contrato a fijo discontinuo</p><p class=\"parrafo-normal\">La empresa podrá ofrecer al personal contratado en la actualidad como indefinido ordinario los diferentes bloques contractuales de los contratos fijos discontinuos, en caso de que los hubiera y siempre y cuando así lo prefieran las personas contratadas, las cuales podrán solicitar la modificación de su contrato de trabajo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 38.- Salario fijo del personal fijo discontinuo",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 38.- Salario fijo del personal fijo discontinuo</p><p class=\"articulo-titulo\">Artículo 38.1.- Plan de Vinculación</p><p class=\"parrafo-normal\">Para el abono del concepto plan de vinculación al personal fijo discontinuo se tendrá en cuenta la suma de los llamamientos efectivamente realizados en Massimo Dutti Logística a los efectos de calcular el período de permanencia en la empresa.</p><p class=\"articulo-titulo\">Artículo 38.2.- Salario variable</p><p class=\"articulo-titulo\">Artículo 38.2.1.- Evaluación de desempeño</p><p class=\"parrafo-normal\">Hasta el año 2025, en el caso de las personas con contrato fijo discontinuo, se realiza la evaluación transcurridos 6 meses de trabajo efectivo y se percibirá a partir de la nómina del mes siguiente y únicamente durante el periodo de actividad, y a partir de aquí se realiza una evaluación una vez al año.</p><p class=\"parrafo-normal\">A partir de 2026 se aplicará lo dispuesto en el artículo 7.2 del presente Acuerdo en relación con la consolidación de los importes descritos en el artículo, así como en el nuevo sistema de evaluación de desempeño.</p><p class=\"articulo-titulo\">Artículo 38.2.2- Prima vacacional</p><p class=\"parrafo-normal\">El personal con contrato fijo discontinuo podrá acceder a las opciones A, B, C reguladas en el artículo 7.3 del presente acuerdo relativo a la prima vacacional.</p><p class=\"articulo-titulo\">Artículo 38.2.3.-Plus sostenibilidad</p><p class=\"parrafo-normal\">Se abonará en proporción a la duración de la jornada anual de la persona trabajadora y en función del tiempo de trabajo efectivo en el año de percibo.</p><p class=\"articulo-titulo\">Artículo 38.2.4.- Horas extraordinarias</p><p class=\"parrafo-normal\">El personal con contrato fijo discontinuo por defecto cobrará las horas extraordinarias, y tendrá opción de solicitar disfrutarlas en tiempo de descanso de forma voluntaria, siempre y cuando la compensación se realice antes de finalizar su periodo de actividad.</p><p class=\"parrafo-normal\">En el caso de que no se disfrute la compensación en descanso durante el período de Ilamamiento, se procederá a su liquidación económica al finalizar el periodo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 39.- Anticipos de salario y préstamos",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 39.- Anticipos de salario y préstamos</p><p class=\"articulo-titulo\">Artículo 39.1.- Préstamos</p><p class=\"parrafo-normal\">En relación con el personal con contrato fijo discontinuo que reúna los requisitos para poder solicitar un préstamo, podrán solicitar un préstamo al inicio del periodo de actividad, cuyo importe pueda devolver durante el mismo periodo de actividad en el que se solicitó, teniendo en cuenta que no podrá ser inferior al salario mínimo determinado legalmente. Por lo tanto, no resultan de aplicación los importes regulados en el artículo 13 del presente Acuerdo de condiciones para el personal fijo discontinuo.</p><p class=\"parrafo-normal\">En el caso de extinción de la relación laboral, por cualquier causa, el importe del préstamo no devuelto se descontará de la liquidación de haberes que corresponda. En el caso de no ser suficiente para saldar la deuda el importe de la liquidación de haberes, ambas partes acordarán cómo se realizará la devolución; para el caso en que no se llegue a acuerdo sobre la devolución, se procederá a la reclamación de la deuda como legalmente corresponda.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 40.- Categoría profesional",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 40.- Categoría profesional</p><p class=\"parrafo-normal\">El personal fijo discontinuo adquirirá la categoría de operario/a especializado/a a partir de los 24 meses de prestación efectiva de trabajo</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 41.- Turnos de trabajo",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 41.- Turnos de trabajo</p><p class=\"parrafo-normal\">La empresa informará anualmente y previo a la incorporación al periodo de actividad, el turno de trabajo de la persona trabajadora, dentro de los especificados en el presente acuerdo (artículo 16) y reflejándose el mismo en su calendario anual.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 42.- Cambio de turno voluntario",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 42.- Cambio de turno voluntario</p><p class=\"parrafo-normal\">Al tratarse de un colectivo que en cada llamamiento se les indicará el turno de trabajo asignado, no podrán acogerse al cambio de turno voluntario regulado en el artículo 16.3 del acuerdo, pero sí tendrán opción a solicitar un cambio de turno temporal dentro de su período de actividad de ese año, tal y como establece el artículo 16.3 BIS.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 43.- Calendario laboral",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 43.- Calendario laboral</p><p class=\"articulo-titulo\">Artículo 43.1.- Cupos</p><p class=\"parrafo-normal\">Se diferenciará el cupo para el personal fijo discontinuo, garantizando un cupo independiente para ellos.</p><p class=\"articulo-titulo\">Artículo 43.2.- Días de exceso</p><p class=\"parrafo-normal\">Los días de exceso de jornada serán proporcionales al periodo de actividad y se ofertará a la persona trabajadora planificarlos en su incorporación.</p><p class=\"lista-letra\">• En el caso de realizar periodos extraordinarios durante el año:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;•&nbsp;Si realizan periodos extraordinarios por delante de su periodo ordinario, se hace un primer recálculo en el momento de inicio del periodo de&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; actividad ordinario y un nuevo cálculo al final los periodos anuales.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;•&nbsp;Si no realizan periodos extraordinarios o dichos periodos se realizan por detrás de su jornada, se recalcula una vez finalizados los periodos.</p><p class=\"parrafo-normal\">En el caso de que personas que hayan generado más horas de exceso tras el recálculo se ofrece poderlas calendarizar durante el primer trimestre del año siguiente.</p><p class=\"articulo-titulo\">Artículo 43.3.- Bolsa negativa de horas</p><p class=\"parrafo-normal\">El personal con contrato fijo discontinuo podrá acogerse a la bolsa de horas durante su periodo de actividad con el límite establecido proporcional a su jornada.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 44.- Vacaciones:",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 44.- Vacaciones:</p><p class=\"parrafo-normal\">Al personal con contrato fijo discontinuo le corresponderían los días de vacaciones en proporción al periodo de actividad que realice.</p><p class=\"parrafo-normal\">El personal fijo discontinuo podrá disfrutar las vacaciones debiendo calendarlas por semanas completas, dentro de los cupos establecidos en el centro, planificándolo en el momento de su incorporación y no pudiendo calendar los días sueltos, por lo que si no generan días suficientes para calendar una semana, los días sueltos se liquidarán al final del llamamiento. Asimismo, la persona podrá solicitar que se le liquiden las vacaciones al final del llamamiento y no calendar su disfrute.</p><p class=\"parrafo-normal\">La empresa podrá ofrecer la opción de disfrutar de días de vacaciones no planificadas por motivos de producción al personal, el cual, de forma voluntaria podrá optar o no a dicha solicitud, independientemente de las opciones descritas anteriormente.</p><p class=\"parrafo-normal\">En el caso de realizar periodos extraordinarios durante el año, en la medida de lo posible, la empresa informará de las vacaciones generadas en el llamamiento del periodo extraordinario efectivamente realizado. Si no fuera posible por ser periodos relativamente cortos se actuará según el siguiente criterio:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;Si realizan periodos extraordinarios por delante de su periodo ordinario, se recalcularán las vacaciones antes del inicio del periodo de actividad&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ordinario para dar la opción a la persona a planificar durante dicho período.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;Si no realizan periodos extraordinarios o dichos periodos se realizan por detrás de periodo previsto, se recalcula una vez finalizados los periodos y se&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; liquidarán en el finiquito.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 45.- Licencias y permisos",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 45.- Licencias y permisos</p><p class=\"parrafo-normal\">El personal fijo discontinuo disfrutará los permisos recogidos en el presente Acuerdo, con las siguientes matizaciones:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;•&nbsp;Las horas disponibles de la bolsa de acompañamiento serán proporcionales al tiempo de contrato para cada persona con contrato fijo discontinuo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 46.- Conciliación vida laboral y familiar",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 46.- Conciliación vida laboral y familiar</p><p class=\"parrafo-normal\">El personal fijo discontinuo podrá disfrutar de las medidas de conciliación de la vida laboral y familiar reguladas en el presente acuerdo de forma compatible a la naturaleza fija discontinua de su contrato.</p><p class=\"parrafo-normal\">Las horas disponibles de la bolsa de acompañamiento serán proporcionales al tiempo de contrato para cada persona con contrato fijo discontinuo.</p><p class=\"articulo-titulo\">Artículo 46.1.- Concentración / Acumulación de la reducción de jornada (no cole)</p><p class=\"parrafo-normal\">En cuanto a las medidas de conciliación, estarán sujetas al cupo existente durante el periodo de actividad.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 47.- Ayudas sociales",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 47.- Ayudas sociales</p><p class=\"parrafo-normal\">El personal con contrato fijo discontinuo tendrá acceso a las ayudas sociales según lo regulado en el presente artículo:</p><p class=\"lista-letra\">• El personal con contrato fijo discontinuo percibirá las siguientes ayudas, aunque no estén en el periodo de actividad en el momento del abono y se percibirán en la primera nómina del siguiente periodo de actividad:</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; • Ayuda por matrimonio o pareja de hecho&nbsp;</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;• Ayuda por nacimiento&nbsp;</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;• Ayuda por adopción internacional&nbsp;</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;• Ayuda para material escolar&nbsp;</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;• Ayuda para estudios intermedios&nbsp;</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;• Ayuda para estudios universitarios&nbsp; &nbsp; &nbsp; &nbsp;</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; • Asimismo, tendrán acceso a las siguientes ayudas sociales de carácter mensual únicamente por el período que dure el llamamiento:</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; • Ayuda por discapacidad&nbsp;</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; • Ayuda Guardería&nbsp;</p><p class=\"lista-letra\">Para el cobro de las ayudas sociales se tendrá una carencia de 6 meses. Las ayudas sociales no serán proporcionales a la duración del llamamiento.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 48.- Acceso a Servicio comedor/Picnic",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 48.- Acceso a Servicio comedor/Picnic</p><p class=\"parrafo-normal\">Durante los períodos de actividad efectivos, el personal fijo discontinuo tendrá acceso a los servicios de comedor y picnic en las mismas condiciones que el resto del personal.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 49.- Affinity Card",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 49.- Affinity Card</p><p class=\"parrafo-normal\">La tarjeta Affinity Card no se cancelará en los periodos de inactividad.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 50.- Retribución flexible",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 50.- Retribución flexible</p><p class=\"parrafo-normal\">En cuanto a la retribución flexible, el ticket guardería y el ticket restaurante se podrán contratar en los periodos de actividad y solamente el seguro médico se puede mantener a lo largo de todo el año natural regularizándose su pago en las nóminas correspondientes al periodo de llamamiento.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 52.- Servicio de fisioterapia",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 52.- Servicio de fisioterapia</p><p class=\"parrafo-normal\">El personal fijo discontinuo tendrá acceso a las 12 sesiones de fisioterapia independientemente de su duración de contrato, y podrá disfrutarlas durante todo el año natural.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 53 - Servicio de ayuda al empleado/a",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 53 - Servicio de ayuda al empleado/a</p><p class=\"parrafo-normal\">Las sesiones del servicio de ayuda VITAHUB (PAE) no serán proporcionales a la duración de la actividad y se podrá hacer uso durante todo el año natural.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "CAPITULO VI \"DERECHOS SINDICALES\".",
    "contentHtml": ""
  },
  {
    "title": "Artículo 54.- Crédito Sindical.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 54.- Crédito Sindical.</p><p class=\"parrafo-normal\">Las horas sindicales podrán ser acumuladas entre los representantes legales de los trabajadores en una Bolsa de horas anual.</p><p class=\"parrafo-normal\">El tiempo necesario y utilizado para la negociación colectiva y las reuniones convocadas por la empresa se contabilizará como trabajo efectivo y no se descontará del crédito sindical.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 55.- Descuento Afiliación por nómina.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 55.- Descuento Afiliación por nómina.</p><p class=\"parrafo-normal\">El personal que esté afiliado a un sindicato y quieran que se le practique el correspondiente descuento de la cuota sindical directamente de la nómina, lo comunicará por escrito al Dpto. RRHH. Este Dpto. informará mensualmente a cada sindicato descuento mensual de la cuota sindical por nómina de sus afiliados.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 56.- Distribución del Acuerdo 2025-2027.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 56.- Distribución del Acuerdo 2025-2027.</p><p class=\"parrafo-normal\">Massimo Dutti Logística S.A. distribuirá el nuevo Acuerdo de las Condiciones Laborales a todo el personal de la empresa que se rija por dicho Acuerdo y el acta de las votaciones a través de la plataforma INET.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "CAPITULO VII \"OTRAS APLICACIONES\".",
    "contentHtml": ""
  },
  {
    "title": "Artículo 57.- Herramientas de consulta.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 57.- Herramientas de consulta.</p><p class=\"parrafo-normal\">La empresa pondrá a disposición de la persona trabajadora las herramientas diseñadas con diferentes formularios o Apps específicas elaboradas con el fin de poder ayudarles con la gestión de:</p><p class=\"lista-letra\">• Consulta de saldo de horas disponibles&nbsp;</p><p class=\"lista-letra\">• Solicitud o modificación de días completos&nbsp;</p><p class=\"lista-letra\">• Modificación de cobro / compensación de horas extraordinarias realizadas&nbsp;</p><p class=\"lista-letra\">• Solicitud de uniformes y calzado de seguridad • Comunicación visita fisio / podólogo&nbsp;</p><p class=\"lista-letra\">• Solicitudes de ayudas sociales&nbsp;</p><p class=\"lista-letra\">• Solicitudes de vacaciones&nbsp;</p><p class=\"lista-letra\">• Solicitud de cambio de turno voluntario.</p><p class=\"lista-letra\">• Gestión bolsa horas negativa&nbsp;</p><p class=\"lista-letra\">• Gestión bolsa de horas extraordinarias</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "DISPOSICIÓN ADICIONAL",
    "contentHtml": "\n                            \n<p class=\"articulo-titulo\">DISPOSICIÓN ADICIONAL</p><p class=\"parrafo-normal\">La empresa ha puesto a disposición del personal indefinido y fijo discontinuo un servicio de ayuda VITAHUB (PAE)&nbsp;</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">En prueba de su conformidad, ambas partes firman el presente Acuerdo, en Tordera (Barcelona) a 4 de febrero de 2026.</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">Ambas representaciones, la empresarial y la social, alcanzan un Acuerdo satisfactorio para ambas partes, consolidado por la plantilla en votación, con los siguientes anexos:</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">Anexo I. Tiempos de respuesta</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">Anexo II: Tablas salariales</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">Anexo III. Acta de votación</p>\n\n                        "
  },
  {
    "title": "ANEXO I-Tiempos de respuesta",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">ANEXO I-Tiempos de respuesta</p><p class=\"parrafo-normal\">Se establecen los siguientes tiempos de respuestas para los supuestos de:</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp;<u>• Prorrateo o desprorrateo de pagas extraordinarias</u>: Solicitud de la persona por mail y respuesta por escrito hasta en 7 días naturales:</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- 6.2.- Paga de junio: hasta el 15 de junio&nbsp;</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- 6.2.&nbsp; Paga de navidad: hasta el 15 de enero&nbsp;</p><p class=\"lista-letra\"><span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- 6.2.- Paga de marzo: hasta el 15 de enero.</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- 6.6.- Plan de vinculación: Hasta el 10 de enero.</p><p class=\"lista-letra\"><u>• Para todas las solicitudes de modificaciones horarias:</u></p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Preaviso de la persona de 1 mes vía mail y respuesta de la empresa por escrito de hasta 15 días naturales:</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- 19.- Reducción voluntaria de la jornada&nbsp;</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; - 23.- Excedencias&nbsp;</p><p class=\"parrafo-normal\">&nbsp; &nbsp; ition: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">&nbsp; &nbsp; &nbsp; &nbsp;<u> •&nbsp;</u><u>Peticiones de las personas trabajadoras:</u> Peticiones vía mail de la persona con una antelación mínima de 7 días naturales, y respuesta de la empresa por&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;escrito, dentro del mismo plazo en 3 días laborables:</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- 16.2.- Cambio de turno por consulta médica propias o familiares de primer grado de consanguinidad.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- 21.- Modificación de vacaciones de invierno.</p><p class=\"lista-letra\"><u>• Peticiones de las personas trabajadoras: </u>Peticiones vía mail de la persona con una antelación mínima de 7 días naturales, y respuesta de la empresa por escrito, dentro del mismo plazo y antes del hecho causante:</p><p class=\"lista-letra\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- 16.1.-Permuta de turno&nbsp;</p><p class=\"list
