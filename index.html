<!DOCTYPE html>
<html lang="es" class="dark" style="font-size: 18px;"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pacto MD 2025-2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        html, body { font-family: 'Inter', system-ui, sans-serif; background-color: #fecaca !important; }
        html.dark, html.dark body { background-color: #111827 !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-track { background: #374151; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .ccoo-logo {
            font-family: 'Arial Black', Impact, sans-serif;
            letter-spacing: 2px;
        }
        .highlight {
            background-color: #fde047;
            color: #000;
            font-weight: bold;
            padding: 0 0.15rem;
            border-radius: 0.15rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .dark .highlight {
            background-color: #b45309;
            color: #fff;
        }
        /* Estructura de Párrafos y Listas */
        .parrafo-normal { margin-bottom: 1.25rem; line-height: 1.6; }
        .lista-numero { margin-top: 1rem; margin-bottom: 0.5rem; margin-left: 1.5rem; font-weight: 500; }
        .lista-letra { margin-bottom: 0.25rem; margin-left: 3rem; }
        .articulo-titulo { font-weight: 700; margin-top: 1.5rem; margin-bottom: 1rem; }

        /* Forzar el color del texto para ignorar estilos en línea (inline styles) que rompen el modo claro */
        .content *:not(.highlight) {
            color: inherit !important;
        }

        /* Hacer los bordes de las tablas mucho más visibles en ambos modos */
        .content table, .content th, .content td, .content tr {
            border-color: #9ca3af !important; /* gris más oscuro para que se vea bien en claro */
        }
        .dark .content table, .dark .content th, .dark .content td, .dark .content tr {
            border-color: #4b5563 !important;
        }
    </style>

<body class="text-gray-800 dark:text-gray-200 h-screen flex flex-col bg-red-50 dark:bg-red-950 transition-colors duration-300" cz-shortcut-listen="true">

    <!-- Cabecera CCOO -->
    <header class="bg-[#FF5000] text-white shadow-md z-20 sticky top-0 flex-shrink-0">
        <div class="max-w-5xl mx-auto px-3 py-2 flex items-center justify-between h-14">
            
            <!-- Logo & Título -->
            <div class="flex items-center gap-2 transition-all duration-300" id="header-title-container">
                <div class="text-2xl sm:text-3xl font-black ccoo-logo leading-none mt-1">CCOO</div>
                <div class="h-6 w-px bg-white/40 hidden sm:block"></div>
                <div class="leading-none flex flex-col justify-center">
                    <h1 class="text-[13px] sm:text-xl font-bold uppercase tracking-wide leading-tight">Pacto MD</h1>
                    <p class="text-[11px] sm:text-sm text-white/90 font-medium leading-tight mt-0.5">2025-2027</p>
                </div>
            </div>

            <!-- Buscador y Acciones -->
            <div class="flex items-center gap-1 flex-1 justify-end h-full">
                <!-- Buscador (Oculto en móvil inicialmente) -->
                <div id="search-container" class="hidden sm:flex relative w-full max-w-sm ml-2 transition-all duration-300">
                    <!-- Input con más padding a la derecha para que quepan los botones -->
                    <input type="text" id="search-input" class="w-full py-1.5 sm:py-2 pl-9 sm:pl-10 pr-16 sm:pr-10 text-sm rounded shadow-inner text-gray-900 bg-white dark:bg-gray-800 dark:text-white dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-[#FF5000]" placeholder="Buscar...">
                    
                    <!-- Lupa -->
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    
                    <!-- Botón limpiar (Basura) -->
                    <button id="clear-search-btn" class="absolute right-8 sm:right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#FF5000] p-1.5 focus:outline-none transition-colors" title="Limpiar campo">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>

                    <!-- Cerrar buscador (Solo móvil) -->
                    <button id="close-search-btn" class="sm:hidden absolute right-1 top-1/2 -translate-y-1/2 text-gray-400 p-2 focus:outline-none" title="Cerrar buscador">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <!-- Botones de Acción -->
                <div id="action-buttons" class="flex items-center gap-1 sm:gap-2">
                    
                    <!-- Botón Editar / Guardar -->
                    <button id="edit-mode-btn" class="hidden p-1.5 hover:bg-blue-600 text-white rounded transition-colors text-xs font-bold px-2 sm:px-3 flex items-center gap-1 bg-blue-600/80" title="Activar Modo Edición">
                        <svg id="edit-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        <svg id="save-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                        <span class="hidden sm:inline" id="edit-mode-text">Editar Pacto</span>
                    </button>

                    <!-- Botón Lupa (Solo móvil) -->
                    <button id="open-search-btn" class="sm:hidden p-1.5 bg-white/20 hover:bg-white/30 text-white rounded transition-colors" title="Buscar">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </button>

                    <!-- Botones Tamaño de Letra -->
                    <div class="flex items-center bg-white/20 rounded">
                        <button id="font-decrease-btn" class="p-1.5 hover:bg-white/30 text-white rounded-l transition-colors" title="Reducir letra">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                        </button>
                        <div class="w-px h-4 bg-white/30"></div>
                        <button id="font-increase-btn" class="p-1.5 hover:bg-white/30 text-white rounded-r transition-colors" title="Aumentar letra">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </button>
                    </div>

    <!-- AQUÍ ESTÁ INCRUSTADO EL TEXTO EXACTO DEL PACTO PARA QUE EL CÓDIGO LO LEA -->
    <script type="text/plain" id="pacto-data">[
  {
    "title": "ACUERDO DE",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"parrafo-normal\">ACUERDO DE CONDICIONES DE TRABAJO DE MASSIMO DUTTI LOGÍSTICA S.A.</p><p class=\"parrafo-normal\">2025-2027 Reunidos en Tordera (Barcelona), el día 4 de febrero 2026, los componentes de la mesa negociadora, de una parte, la representación de la empresa Massimo Dutti Logística S.A.</p><p class=\"parrafo-normal\">y de la otra el Comité de Empresa representado por los sindicatos CCOO y UGT.</p><p class=\"parrafo-normal\">Por la parte empresarial:</p><p class=\"parrafo-normal\">Inma Martínez Farrán (Responsable RRHH Massimo Dutti Logística S.A.) Humberto Rejes Díaz (Director Massimo Dutti Logística S.A) Anabel Blázquez González (Técnica RRHH) Virginia Barrionuevo Pérez (Responsable RRHH Cadenas).</p><p class=\"parrafo-normal\">Alba Costoya Novo (Jurídico-laboral Inditex) Por la parte social:</p><p class=\"parrafo-normal\">Verónica Ramos Alfonso (CCOO) Beatriz García Caba (CCOO) Ramón Velasco Rubio (CCOO) Miguel Ángel Raya Fernández (UGT) Mercedes Lara Soto (UGT) Verónica Medina Jiménez (UGT) Ambas representaciones, la empresarial y la social, por medio del presente Acuerdo regulan mejoras de las condiciones recogidas en el convenio de ámbito superior que resulta de aplicación.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "CAPITULO I \"APLICACIÓN DEL ACUERDO\"",
    "contentHtml": ""
  },
  {
    "title": "Artículo 1. Ámbito, vigencia y vinculación a la totalidad.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 1. Ámbito, vigencia y vinculación a la totalidad.</p><p class=\"parrafo-normal\">Este Acuerdo será de aplicación en el centro de trabajo que la Empresa Massimo Dutti Logística S.A. posee en Tordera (Barcelona) regulando las condiciones laborales del personal con categoría de operario/operaria, operario/operaria especializado/a, operario/operaria torista, operario/operaria segundo/a de sección, operario/operaria asistente de producción, operario/operaria de tareas específicas y operario/operaria apoyo automatista.</p><p class=\"parrafo-normal\">El presente Acuerdo tendrá una vigencia de tres años, entrando en vigor desde la firma del acuerdo, salvo a efectos de atrasos salariales acordados en cada uno de los preceptos, que se calcularán a fecha 1 de enero de 2025, hasta el 31 de diciembre de 2027.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 2. Comisión paritaria y seguimiento del Acuerdo.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 2. Comisión paritaria y seguimiento del Acuerdo.</p><p class=\"parrafo-normal\">Se crea una comisión paritaria del seguimiento del Acuerdo cuya misión principal será el conocimiento y resolución de incidencias derivadas de la aplicación e interpretación del presente acuerdo. Adicionalmente podrán conocer las cuestiones que las partes decidan someter a su competencia.</p><p class=\"parrafo-normal\">La comisión paritaria estará conformada por tres representantes de la empresa y otros tres en representación de la parte social. La comisión paritaria se reunirá dentro de los tres días siguientes a su convocatoria por cualquiera de las partes y resolverá sobre las cuestiones sometidas a su competencia con carácter previo a cualquier otra vía de resolución en el plazo máximo de 30 días.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 3. Denuncia y prorroga.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 3. Denuncia y prorroga.</p><p class=\"parrafo-normal\">La denuncia del presente acuerdo será automática el día 31 de diciembre de 2027; la parte social presentará la plataforma reivindicativa para las negociaciones del próximo acuerdo, comprometiéndose la empresa a iniciar las negociaciones del mismo a partir de dicha fecha.</p><p class=\"parrafo-normal\">Se entiende que el presente acuerdo seguirá en vigor mientras no sea sustituido por uno nuevo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "CAPITULO II.-CONDICIONES ECONÓMICAS",
    "contentHtml": ""
  },
  {
    "title": "Artículo 4. Revisión Salarial.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 4. Revisión Salarial.</p><p class=\"parrafo-normal\">La revisión salarial de aplicación al personal con las categorías indicadas en el artículo 1 del presente acuerdo será la siguiente y se aplicará como se indica en el presente acuerdo.</p><p class=\"parrafo-normal\">Año 2025: El incremento salarial para el año 2025 será del 5,0%.</p><p class=\"parrafo-normal\">Año 2026: El incremento salarial para el año 2026 será del 3,5%.</p><p class=\"parrafo-normal\">Año 2027: El incremento salarial para el año 2027 será del 3,0%.</p><p class=\"parrafo-normal\">La revisión salarial indicada se aplicará sobre los siguientes conceptos: salario base, pagas extraordinarias (junio y diciembre) y paga de beneficios, horas nocturnas, horas festivas, horas extraordinarias, horas extraordinarias festivas, horas extraordinarias nocturnas.</p><p class=\"parrafo-normal\">Para los tres años de vigencia del actual pacto, una vez el INE publique cómo ha cerrado el IPC real anual del año precedente, se calculará la diferencia entre este IPC publicado y el porcentaje acordado en el presente acuerdo para cada año de vigencia (2025 2026-2027). Esa diferencia se aplicará a los conceptos salariales antes indicados con un tope máximo del 6%, y se abonarán los atrasos en una paga (a abonar en el mes de febrero o marzo del año siguiente). Las tablas salariales se actualizarán con la diferencia entre el incremento pactado y el porcentaje real de IPC indicado aplicándole, en todo caso, el tope máximo del 6%.</p><p class=\"parrafo-normal\">Se adjuntan las tablas salariales en el Anexo II.</p><p class=\"parrafo-normal\">Los porcentajes de revisión salarial regulados en este artículo no se aplicarán a los siguientes conceptos: Paga de Septiembre, Ayudas Sociales, Plus Acuerdo, Plus Transporte, Plus Operario / Operaria segundo/a de sección, Plus Operario / Operaria con Tareas Específicas, Plan de Vinculación, Prima Vacacional y Paga de Sostenibilidad.</p><p class=\"parrafo-normal\">Asimismo, determinados conceptos regulados en el presente Acuerdo tendrán una subida salarial diferente a la recogida en el presente artículo y que se especificará en el correspondiente precepto.</p><p class=\"parrafo-normal\">Con carácter general, las retribuciones se percibirán de forma proporcional a la jornada pactada del personal. Aquellos conceptos que no se paguen proporcionales a la jornada se indicarán en el propio precepto que lo regule.</p><p class=\"parrafo-normal\">El incremento salarial pactado relativo al año 2025 y hasta la firma del acuerdo, se abonará en concepto de atrasos salariales.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 5. Estructura de la nómina.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 5. Estructura de la nómina.</p><p class=\"parrafo-normal\">La retribución del personal afectado por el presente Acuerdo se estructura en los siguientes conceptos:</p><p class=\"lista-numero\">1. Salario Fijo:</p><p class=\"lista-letra\">a) Salario Base.</p><p class=\"lista-letra\">b) Paga de marzo o beneficios.</p><p class=\"lista-letra\">c) Pagas extraordinarias de junio y navidad.</p><p class=\"lista-letra\">d) Paga de septiembre.</p><p class=\"lista-letra\">e) Plus acuerdo f) Plus nocturnidad g) Plan vinculación h) Plus Operario / Operaria Segundo/a de Sección i) Plus Operario / Operaria Asistente de Producción j) Plus Operario / Operaria Apoyo Automatista k) Plus Operario / Operaria con Tareas Específicas 2. Salario Variable:</p><p class=\"lista-letra\">a) Horas nocturnas b) Plus asistencia (2025) c) Plus transporte d) Evaluación del Desempeño (2025) e) Prima Vacacional f) Plus sostenibilidad Asimismo, el precio hora se calculará a razón de los siguientes conceptos: salario base, paga extraordinaria de junio, paga extraordinaria de Navidad/diciembre, paga de beneficios y paga de septiembre.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 6. Salario Fijo.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 6. Salario Fijo.</p><p class=\"articulo-titulo\">Artículo 6.1. Salario Base</p><p class=\"parrafo-normal\">El salario base es aquél que se determina como tal en las tablas salariales anexadas al presente Acuerdo, que se abona en 12 mensualidades ordinarias.</p><p class=\"articulo-titulo\">Artículo 6.2. Pagas Extraordinarias</p><p class=\"parrafo-normal\">Se percibirán tres pagas extraordinarias anualmente. El importe de cada paga extraordinaria se compone de Salario Base.</p><p class=\"parrafo-normal\">La paga extraordinaria de junio, su devengo es anual, de julio a junio percibiéndose su importe el 15 de junio de cada año.</p><p class=\"parrafo-normal\">La paga extraordinaria de Navidad, su devengo es anual, de enero a diciembre, percibiéndose su importe el 15 de diciembre de cada año.</p><p class=\"parrafo-normal\">La paga de marzo o de beneficios, su devengo es anual, de enero a diciembre.</p><p class=\"parrafo-normal\">Las tres pagas extraordinarias podrán percibirse de forma integra en un solo pago o bien podrán percibirse de forma prorrateada. Quien quiera percibir el importe de alguna de las pagas de forma prorrateada tendrá que comunicar su decisión a la empresa por escrito según lo recogido en el Anexo I - Tiempos de Respuesta, del presente acuerdo.</p><p class=\"parrafo-normal\">De no comunicar nada a la empresa, automáticamente se entiende que se percibirán de forma integra las pagas de junio y de Navidad y de forma prorrateada la paga de marzo o beneficios. Una vez que se opte por el abono de una paga de una forma concreta, esta modalidad de abono se mantendrá en este formato hasta que se vuelva a solicitar por escrito la otra modalidad en el plazo antes indicado. El importe económico a percibir será el mismo, con independencia de la modalidad de abono de las pagas.</p><p class=\"parrafo-normal\">Las nóminas de las pagas ordinarias se abonarán el último viernes del mes, incluidos los meses en los que, si es el caso, se abonen las pagas extraordinarias.</p><p class=\"articulo-titulo\">Artículo 6.3.- Paga de septiembre.</p><p class=\"parrafo-normal\">En la mensualidad de septiembre se abonará una paga por importe de 390,66 € brutos, establecido en las tablas salariales anexas. Esta paga se abonará en proporción a la duración de la jornada. La paga de septiembre se devenga anualmente de septiembre a agosto.</p><p class=\"articulo-titulo\">Artículo 6.4.- Plus Acuerdo.</p><p class=\"parrafo-normal\">Se establece un Plus Acuerdo cuyo importe anual durante la vigencia será el siguiente:</p><div class=\"overflow-x-auto mb-6 mt-2\"><table class=\"w-full text-sm text-left border-collapse border border-gray-300 shadow-sm\"><tbody><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Año</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Importe anual  bruto</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">2025</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">682,50 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">2026</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">1.882,50 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">2027</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">1.882,50 €</td></tr></tbody></table></div><p class=\"parrafo-normal\">Estos importes se abonarán de forma prorrateada en doce (12) mensualidades. Para las personas con incorporación o cese durante el año, se abonará en proporción al tiempo de prestación efectiva de servicios y no computará para el cálculo de la hora ordinaria.</p><p class=\"parrafo-normal\">A partir de 2026, el importe del variable de evaluación equivalente a 100 €/mes queda consolidado en el importe anteriormente indicado de este concepto, según lo previsto en el articulo 7.2.</p><p class=\"parrafo-normal\">Se abonará mensualmente a las categorías adscritas a este acuerdo y que tengan una antigüedad mínima de 6 meses en la empresa. Se abonará en proporción a la jornada que se tenga pactada.</p><p class=\"parrafo-normal\">El incremento pactado correspondiente al año 2025 y hasta la firma del acuerdo se abonará en concepto de atrasos salariales.</p><p class=\"articulo-titulo\">Artículo 6.5.- Pluses de puesto de trabajo.</p><p class=\"parrafo-normal\">Se establecen los siguientes pluses en función del puesto de trabajo:</p><p class=\"lista-letra\">a) Plus Responsabilidad Segundos/as: este concepto se abonará a quienes realicen las funciones de \"operario/operaria segundo/a de sección\". Durante los primeros seis meses de prestación de servicios en este concepto se percibirá en este concepto el importe de 50 euros brutos mensuales por el desempeño de la misma. Si a los 6 meses se consolida el puesto y se percibirá en este concepto el importe de 180 euros brutos mensuales durante la vigencia del Acuerdo. Se percibirán los importes indicados en el presente apartado siempre y cuando realicen las funciones correspondientes a la citada categoría.</p><p class=\"lista-letra\">b) Plus Operario/Operaria Asistente de Producción: este concepto se abonará a quienes, después de haber prestado servicios durante 6 meses y realizar las funciones de \"operario/operaria asistente de producción\", la hayan consolidado y siempre y cuando realicen las funciones correspondientes a la misma. El importe de este plus es el que se refleja en las tablas salariales del presente Acuerdo que figuran en el Anexo II, sujeto a revisión salarial.</p><p class=\"lista-letra\">c) Plus Operario/Operaria Apoyo Automatista: este concepto se abonará a quienes, después de haber prestado servicios durante 6 meses y realizar las funciones de \"operario/operaria apoyo automatista\", la hayan consolidado y siempre y cuando realicen las funciones correspondientes a la misma. El importe de este plus es el que se refleja en las tablas salariales al presente Acuerdo que figuran en el Anexo II, sujeto a revisión salarial.</p><p class=\"lista-letra\">d) Plus Operario/Operaria con Tareas Específicas: este concepto se abonará a quienes, después de haber prestado servicios durante 6 meses y realizado las funciones de \"operario/operaria con tareas específicas\", ya la hayan consolidado y siempre que realicen las funciones correspondientes a la misma. El importe de este plus es el que se refleja en las tablas salariales al presente Acuerdo que figuran en el Anexo II.</p><p class=\"parrafo-normal\">El incremento salarial pactado relativos a los pluses recogidos en los apartados a), b) y c) relativos al año 2025 y hasta la firma del acuerdo se abonará en concepto de atrasos salariales.</p><p class=\"articulo-titulo\">Artículo 6.6.- Plan de vinculación</p><p class=\"parrafo-normal\">Se establece una paga anual en función del período de permanencia en la empresa.</p><p class=\"parrafo-normal\">Para el cálculo de este periodo de permanencia se tendrá en cuenta la fecha de antigüedad en la empresa, de acuerdo con el siguiente escalado en el que se reflejan los importes brutos:</p><div class=\"overflow-x-auto mb-6 mt-2\"><table class=\"w-full text-sm text-left border-collapse border border-gray-300 shadow-sm\"><tbody><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Permanencia en  la empresa</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Importe</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 3 a 5 años</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">200 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 6 a 8 años</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">260 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 9 a 11 años</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">400 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 12 a 14 años</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">450 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 15 a 17 años</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">570 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 18 a 20 años</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">700 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 21 a 23 años</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">900 €</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">A partir de 24 años</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">1.200 €</td></tr></tbody></table></div><p class=\"parrafo-normal\">El devengo del presente concepto es anual, del 1 de enero a 31 de diciembre, a percibir en el mes de abril del año siguiente. La persona trabajadora podrá elegir si lo quiere percibir en un pago único o de forma prorrateada. Esta elección deberá hacerse antes del 10 de enero del año natural, en el caso de no realizar ninguna manifestación, el pago de este concepto se realizará en un pago único. No se podrá modificar la forma de abono elegido durante el año natural, se podrá hacer para el siguiente año.</p><p class=\"parrafo-normal\">Se abonará en proporción a la duración de la jornada y en función del tiempo trabajado en el período de devengo. Para los años en que cambie el importe a cobrar según el periodo de permanencia, el importe resultante será proporcional teniendo en cuenta la antigüedad devengada en cada uno de los meses.</p><p class=\"parrafo-normal\">En caso de no estar de alta en la empresa en una parte o en el total del período anual de devengo, se abonará la parte proporcional que corresponda. Se exceptúan las bajas por I.T., suspensiones del contrato por nacimiento o adopción de menor, situación de baja por riesgo por embarazo y permisos retribuidos. A partir de los 24 años de permanencia en la empresa, se seguirá percibiendo anualmente, pero no se aumentará el importe de este concepto, percibiéndose en el importe fijo establecido para los 24 años en el cuadro anterior.</p><p class=\"parrafo-normal\">Se abonará en proporción a la jornada, excepto para las personas de reducción de jornada por guarda legal que se considerará que prestan sus servicios en su jornada de origen a estos efectos.</p><p class=\"parrafo-normal\">Este concepto no se computará para el cálculo de la hora ordinaria.</p><p class=\"parrafo-normal\">El importe correspondiente al año 2025 se abonará en el concepto de atrasos en el mes siguiente a la firma del presente acuerdo, para el caso en que la persona haya escogido la opción de prorrateo de esta paga, puesto que el resto ya lo cobrará íntegro en el mes correspondiente.</p><p class=\"parrafo-normal\">Para el pago de este plus, la antigüedad se tendrá en cuenta según lo siguiente:</p><p class=\"lista-letra\">• Para aquellos supuestos en que la interrupción de contratos sea igual o menor a 20 días, se contabilizará como fecha de antigüedad, la fecha del primer contrato.</p><p class=\"lista-letra\">• Para aquellos supuestos con interrupciones superiores a 20 días y hasta un máximo 6 meses, se calculará el total del tiempo efectivo de trabajo de los anteriores contratos y se sumará este tiempo a la fecha de antigüedad actual retrotrayendo la fecha de antigüedad a la que corresponda.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 7. Salario Variable.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 7. Salario Variable.</p><p class=\"parrafo-normal\">Es aquella parte del salario cuya percepción depende de factores tales como la asistencia al puesto de trabajo o elementos del propio puesto y factores de producción.</p><p class=\"parrafo-normal\">Ambas partes acuerdan suprimir el concepto plus de asistencia a partir de la firma del acuerdo y sustituirlo por el plus de transporte que se regula a continuación.</p><p class=\"articulo-titulo\">Artículo 7.1.- Plus Asistencia (2025)</p><p class=\"parrafo-normal\">El personal percibirá durante 2025 y hasta la firma del acuerdo un concepto denominado \"Plus Asistencia\" en las cuantías que se señalan en el Anexo I. Se abonará en 12 mensualidades y se percibirá de forma proporcional a la jornada que se tenga pactada, a partir de los 6 meses de carencia desde el inicio de la relación laboral en la Compañía.</p><p class=\"parrafo-normal\">Este plus se devenga en el mes en curso y se abona a mes vencido, esto es, en la nómina del mes siguiente.</p><p class=\"parrafo-normal\">Su importe es el determinado en las tablas salariales del Anexo II.</p><p class=\"parrafo-normal\">El presente plus va vinculado a la presencia efectiva del personal, esto es, a los días en los que la persona presta servicios efectivos. A estos efectos, se considera días de presencia efectivas todas las horas fichadas, las horas de vacaciones, las horas excesos, las horas sindicales, permiso de lactancia y las horas de ausencia del sistema 6X8. A estos efectos, no se computará como impuntualidad aquellos casos de catástrofes climatológicas que impidan el acceso al centro de trabajo.</p><p class=\"parrafo-normal\">El funcionamiento del presente plus es el siguiente: por cada persona trabajadora se creará una bolsa mensual por importe de 110 euros brutos/mes para los casos de personal a jornada completa, correspondiendo la creación de una bolsa por importe proporcional para el personal a jornada parcial. Los importes citados se repartirán entre el total de horas efectivas que se hayan realizado durante ese mes, siempre y cuando se cumplan las siguientes condiciones:</p><p class=\"parrafo-normal\">No se percibirá este plus en el mes siguiente en el que se produzcan los siguientes supuestos:</p><p class=\"lista-letra\">• Cuando se produzca una ausencia no justificada.</p><p class=\"lista-letra\">• A partir de la tercera baja y siguientes en el año derivada de contingencia común, en el mes en los que tengan lugar estas IT, no se percibirá importe alguno en el mes, importe que se abonará al mes siguiente del período de IT que corresponda. A estos efectos, el año se computará desde febrero hasta el mes de enero del año siguiente.</p><p class=\"lista-letra\">• Dos impuntualidades en un mes (se entenderá como tal, el retraso a partir de 181 segundos = 3:01 min.)&nbsp;</p><p class=\"lista-letra\">• Incumplimiento de normas: Si se produce sanción disciplinaria en el mes.</p><p class=\"articulo-titulo\">Artículo 7.2.- Plus Transporte</p><p class=\"parrafo-normal\">Para el personal sujeto a este acuerdo se establece un Plus Transporte por importe de 1.600 euros brutos anuales con inicio en 2026 y durante la vigencia del presente Acuerdo.</p><p class=\"parrafo-normal\">Asimismo, el importe del plus de asistencia del pacto 2022-2024 se integra en este concepto de plus transporte, despareciendo de esta forma el plus de asistencia a partir de la firma del acuerdo. A partir de la firma del acuerdo, el importe del variable de evaluación equivalente a 20 €/mes queda consolidado en el importe anteriormente indicado de este concepto (esto es, dentro de los 1.600 euros brutos), según lo previsto en el artículo 7.3.</p><p class=\"parrafo-normal\">Este concepto tiene como objetivo compensar los gastos de transporte y distancia que han de asumir las personas trabajadoras por razón de su asistencia al puesto de trabajo, todas aquellas personas que realicen una jornada a tiempo parcial o reducida, empleando en ello el mismo número de días de trabajo y de desplazamientos al centro de trabajo que las personas trabajadoras a jornada completa comparables, percibirán el plus de transporte en la misma cuantía que éstos sin minoración alguna. El plus estará ligado a presencia efectiva pero no a la duración de la jornada.</p><p class=\"parrafo-normal\">Para el cálculo del importe a abonar se dividirá el importe anual fijado entre los días laborables, multiplicándose por el número de días de trabajo efectivo del mes de la persona, siendo un importe bruto de 7,30€/día a lo largo de la vigencia del acuerdo.</p><p class=\"articulo-titulo\">Artículo 7.3.- Evaluación del desempeño (2025)</p><p class=\"parrafo-normal\">La evaluación del desempeño es una herramienta que permite valorar el desarrollo y la evolución profesional de la persona trabajadora dentro de la compañía. Se realiza una vez al año y a partir del año 2026 se desvincula su realización del abono de un concepto salarial. Por este motivo, a partir del 2026 del importe total de este concepto (120 euros brutos), 100 euros brutos se consolidarán en el importe del plus acuerdo y los 20 euros brutos restantes se consolidarán en el plus transporte.</p><p class=\"parrafo-normal\"><u>Para el año 2025 se aplica según lo siguiente:</u>&nbsp;</p><p class=\"parrafo-normal\">Se realiza una vez al año y conlleva el abono de un incentivo mensual, durante los 12 meses siguientes a la realización de la citada evaluación y hasta la firma del acuerdo. En los casos en los que las personas no hayan estado un mínimo de 6 meses del período evaluado, se realizará la evaluación de manera extraordinaria transcurridos los 6 meses a su incorporación efectiva.</p><p class=\"parrafo-normal\">La evaluación consiste en que el responsable realiza un análisis sobre las personas de su equipo para reforzar actitudes y comportamientos a la vez que identifica su potencial.</p><p class=\"parrafo-normal\">De esta forma permite a la persona evaluada conocer lo que se espera de él/ella, que pueda identificar las áreas fuertes y de mejora y que conozca las prioridades en su puesto de trabajo.</p><p class=\"parrafo-normal\">Se evalúa, en concreto, lo siguiente:</p><p class=\"lista-letra\">• El nivel de rendimiento: se evalúa el nivel de desempeño de cada una de las funciones/tareas que requiere el puesto; supone el 60% de la evaluación, que se compensa con 60 euros brutos.</p><p class=\"lista-letra\">• El nivel de valores y compromiso con la Compañía: se evalúan las actitudes que marcan el compromiso de las personas en su puesto y con la empresa, supone el 40% de la evaluación, que se compensa con 40 euros brutos.</p><p class=\"lista-letra\">• El nivel de talento para el puesto: para poder acceder a esta puntuación se deberá obtener un mínimo del 48% del rendimiento sobre 60% y a su vez un mínimo del 32% de valores sobre 40%. En el talento se evalúa la capacidad de realizar el trabajo diario con un alto nivel de excelencia e iniciativa, siendo además un referente para responsables y compañeros. Este concepto se compensa con un importe de 15 € si se obtiene una puntuación de 100% en este apartado, abonándose la parte proporcional si se obtuviesen porcentajes inferiores.</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\">La ponderación de cada una de las variables que aparecen en la evaluación será:</p><p class=\"lista-letra\">• Adecuado, donde la conducta de la persona es correcta.</p><p class=\"lista-letra\">• Óptimo, en ocasiones el profesional ha mostrado esa conducta, pero no es típica en su repertorio de actuación.</p><p class=\"lista-letra\">• Destacable, es una conducta habitual y típica en su repertorio de actuación.</p><p class=\"articulo-titulo\">Artículo 7.4.- Prima Vacacional</p><p class=\"parrafo-normal\">Se establecen las siguientes opciones de prima vacacional para la persona que, bajo petición de la empresa, acepte modificar sus vacaciones planificadas en los siguientes supuestos:</p><p class=\"parrafo-normal\">Durante el año 2025 y hasta el momento de la firma del acuerdo:</p><p class=\"lista-letra\">• Opción A: Para cada semana que la persona trabajadora planifique en los periodos de baja producción señalados por la empresa, con el calendario laboral, percibirá una prima vacacional por importe de 100€ brutos/semana, pudiendo llegar a un máximo de 500€ brutos por la planificación de todas las vacaciones (5 semanas).</p><p class=\"lista-letra\">• Opción B: Para cubrir períodos valle de producción durante el año, y previa petición de la empresa, el trabajador/a que voluntariamente mueva una semana de sus vacaciones planificadas de verano o del segundo semestre, recibirá el importe 225€ por semana.</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\">A partir de la firma del acuerdo:</p><p class=\"parrafo-normal\">La prima vacacional se abonará distinguiendo momentos de producción y momentos de baja producción, de acuerdo con las especificaciones que se establecen a continuación:</p><p class=\"parrafo-normal\">Momentos de producción:</p><p class=\"lista-letra\">• Opción A: La persona que acepte desplanificar una semana de en un momento de producción y planificarla después en una semana bajo cupo, percibirá 265 euros brutos por cada semana que mueva&nbsp;</p><p class=\"lista-letra\">• Opción B: La persona que acepte mover una semana de sus vacaciones planificadas en su calendario anual para disfrutarla en el momento en el que se lo planifique la empresa, percibirá 400 euros brutos por cada semana que mueva.</p><p class=\"lista-letra\"><br></p><p class=\"lista-letra\"><span style=\"color: rgb(209, 213, 219);\">Momentos de baja producción:</p><p class=\"lista-letra\"><span style=\"font-size: 0.875rem;\"><br></p><p class=\"lista-letra\">• Opción C: La persona que acepte mover una semana de sus vacaciones planificadas en su calendario anual para disfrutarla en un momento de baja producción determinado por la empresa, percibirá 300 euros brutos por cada semana que mueva.</p><p class=\"lista-letra\">• Opción D (Bolsa de vacaciones): Con el calendario anual, la persona que se acoja a esta opción planificará sus 5 semanas de vacaciones y escogerá una semana de verano, octubre o diciembre de manera voluntaria para dejarla en una bolsa de vacaciones, donde la empresa le asignará su disfrute durante el año en curso en semanas de baja producción. Garantizando que se priorizará a las personas apuntadas en la bolsa de vacaciones en primer lugar en bajones de producción.&nbsp;<span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">Se acuerda un cupo garantizado anualmente de 35 personas. La semana a desplanificar será a elección de la persona y aquellos huecos que se queden liberados como consecuencia de la opción de la persona por el pago de la prima no se podrán cubrir con otras personas. En esta opción se abonará un importe de 450 euros brutos por cada semana.</p><p class=\"lista-letra\"><span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\"><br></p><p class=\"parrafo-normal\">Para todos los supuestos, la empresa podrá avisar a la persona hasta el viernes anterior a la semana de disfrute, una vez reciba las unidades de producción, y la asignación se realizará teniendo en cuenta el disfrute de los años anteriores, salvo el primer año, que, en su defecto, se realizaría por antigüedad.</p><p class=\"parrafo-normal\">En el caso de que en las opciones A, B y C anteriores la persona no pueda mover la semana completa, y la empresa acepte el cambio parcial de la semana, la prima vacacional se abonará proporcionalmente al número de días sujetos a modificación.</p><p class=\"articulo-titulo\">Artículo 7.5.- Plus de sostenibilidad</p><p class=\"parrafo-normal\">Massimo Dutti Logística SA, como empresa integrante del Grupo Inditex, tiene un compromiso fundamental con la sostenibilidad que se materializa en un plan estratégico medioambiental publicado por el propio Grupo y en el que, como parte del mismo, participa dentro de sus posibilidades esta empresa.</p><p class=\"parrafo-normal\">Como medida incentivadora de mejora en la sostenibilidad de Massimo Dutti Logística SA se crea el presente plus con un importe bruto anual de 350 euros.</p><p class=\"parrafo-normal\">El pago de este plus se realizará en la nómina de febrero de cada año, de forma proporcional a la jornada sujeto a la consecución de los objetivos de sostenibilidad del año natural anterior (de enero a diciembre). Dichos objetivos estarán vinculados a mantener o mejorar los objetivos actuales de excelencia que tenemos a nivel centro. En el supuesto de que el objetivo anual se sitúe por debajo del 5% de media anual de material no reciclado, se abonará el plus. Si la empresa modificase los objetivos o el sistema de medición, las partes se reunirán para valorar su impacto y, en su caso, revisar el presente apartado.</p><p class=\"parrafo-normal\">Se abonará en proporción a la jornada, excepto para las personas de reducción de a jornada por guarda legal que se considerará que prestan sus servicios en su jornada de origen a estos efectos. El importe de este plus no se verá afectado por las situaciones de incapacidad temporal.</p><p class=\"lista-letra\">• Para el año 2025:</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\">Creación de una bolsa de 290€ por cada persona trabajadora para los casos de personal a jornada completa, y la parte proporcional para el personal a jornada parcial incluyendo el personal con contrato fijo discontinuo, a excepción de la reducción de jornada por guarda legal que se considerará que prestan sus servicios en su jornada de origen a estos efectos.</p><p class=\"parrafo-normal\">Para las personas con bajas médicas por IT igual o superiores a 90 días continuados:</p><p class=\"parrafo-normal\">Se realizará el cálculo proporcional en base a las horas ordinarias trabajadas en el año frente a sus horas de contrato. El importe que dejen de percibir se repartirá entre el resto del personal.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 8.- Compensación por el trabajo en horario nocturno",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 8.- Compensación por el trabajo en horario nocturno</p><p class=\"parrafo-normal\">Se considera trabajo nocturno aquél que se realiza con presencia efectiva entre las 22:00 y las 06:00 horas.</p><p class=\"parrafo-normal\">La prestación de servicios en el horario nocturno se retribuirá de la siguiente manera:</p><p class=\"lista-letra\">a) Plus de nocturnidad: para el colectivo que presta servicios de manera habitual en el turno de domingo noche se acuerda crear este plus como único pago mensual en compensación por la prestación de servicios habitual en el horario indicado.&nbsp;<span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">Se establece que el pago de este concepto será a razón de 39,70 euros brutos cada noche de prestación de servicios efectiva. En el caso de que no se presten servicios efectivos todas las noches establecidas en el calendario de la persona trabajadora, del importe antes indicado, se dejarán de percibir los 39,70 euros brutos por cada noche que no se presten servicios efectivos. Asimismo, si se prestasen servicios de forma parcial en el turno de noche, se percibirá la parte proporcional.&nbsp;</p><p class=\"lista-letra\"><span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">En la actualidad, se considera turno de noche aquel turno que incluye una noche de trabajo calendada en el horario nocturno a la semana.&nbsp;</p><p class=\"lista-letra\"><span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">P<span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">ara el personal que realice horas nocturnas habitualmente, en los períodos vacacionales se les abonará la nocturnidad conforme a lo que&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; correspondería en su calendario laboral, así como para la compensación de horas de exceso según lo recogido en el artículo 20.2 <span style=\"color: rgb(209, 213, 219); font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">del presente acuerdo.</p><p class=\"lista-letra\"><br></p><p class=\"lista-letra\">b) Para el personal que no pertenezca al turno de noche, pero que ocasionalmente preste servicios en horario nocturno, esto es de 22:00 a 06:00 horas, se le abonarán las horas realizadas en el horario nocturno con un recargo del 45% sobre la hora ordinaria.</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\">Tanto en un caso como en el otro, este concepto se percibirá solamente por presencia efectiva y de forma proporcional a la jornada de trabajo. Igualmente, el caso a) y el caso b) no son acumulativos. La prestación de servicios en el horario nocturno se retribuirá de una forma u otra.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 9. Horas festivas.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 9. Horas festivas.</p><p class=\"parrafo-normal\">La jornada laboral ordinaria realizada en un día señalado como festivo por los calendarios oficiales correspondientes se abonará con un recargo del 25% sobre la hora ordinaria.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 10.- Horas Extraordinarias.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 10.- Horas Extraordinarias.</p><p class=\"parrafo-normal\">Las horas extraordinarias se retribuirán con un recargo sobre la hora ordinaria del 75% para los tres años de vigencia del Acuerdo, tal y como se establece en las tablas salariales anexas al presente Acuerdo. A los efectos de lo regulado en el presente</p><p class=\"articulo-titulo\">artículo, se considera hora extraordinaria una vez hayan transcurrido 11 minutos tras la</p><p class=\"parrafo-normal\">finalización del horario teórico de trabajo de cada persona y, una vez transcurrido ese minuto 11, se abonará como hora extraordinaria desde el primer minuto tras la finalización de la jornada laboral teórica.</p><div class=\"overflow-x-auto mb-6 mt-2\"><table class=\"w-full text-sm text-left border-collapse border border-gray-300 shadow-sm\"><tbody><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Precio minuto / extra</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">2025</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">2026</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">2027</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Operario/a especializado/a</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0.46</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0.48</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0.49</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Operario/a torista</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0,5</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0,52</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0.54</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Operario/a logistica</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0,45</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0,46</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">0,47</td></tr></tbody></table></div><p class=\"parrafo-normal\">Se establecen dos maneras de compensar la realización de horas extraordinarias:</p><p class=\"lista-letra\">• Económica: El personal podrá percibir el importe las horas extraordinarias con un recargo sobre la hora ordinaria del 75% (conversión a 1,75), tal y como se establece en las tablas salariales anexas al presente Acuerdo que figura en el Anexo I. En el caso de que la persona haya optado por este sistema de compensación, el abono se realizará a mes vencido.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp;<span style=\"font-size: 0.875rem;\">Compensación en descanso: El personal indefinido podrá acogerse voluntariamente a la compensación de horas extraordinarias por jornadas de&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;descanso, de la siguiente manera: 1 hora extraordinaria equivale a 1.75 horas de descanso.</p><p class=\"parrafo-normal\">Por defecto, y hasta que la persona trabajadora no solicite lo contrario, se procederá a la compensación económica de las horas mencionadas.</p><p class=\"parrafo-normal\">El personal temporal por defecto compensará las horas extraordinarias (incluidas las nocturnas y las festivas) económicamente, ya que por su tipología de contrato no resulta posible que se acojan a la bolsa regulada en el presente acuerdo. No obstante esto, las personas con este tipo de contratos tendrán la opción de compensar las horas extraordinarias en tiempo de descanso dentro de los períodos de baja producción ofertados por la empresa.</p><p class=\"parrafo-normal\">La empresa podrá ofrecer a la persona trabajadora, la realización de horas extras en otras secciones fuera de su turno de origen, si existiera la necesidad.</p><p class=\"articulo-titulo\">Artículo 10.1.- Bolsa de horas extraordinarias</p><p class=\"parrafo-normal\">La compensación de la realización de horas extraordinarias en descanso se gestionará a través de una bolsa de horas extraordinarias que incluirá tanto las horas extraordinarias realizadas (incluidas las de los sábados), como las extraordinarias nocturnas y las extraordinarias festivas.</p><p class=\"parrafo-normal\"><u>La gestión de la bolsa de horas correspondiente al año 2025 se realizará de la siguiente manera:</u></p><p class=\"parrafo-normal\">La compensación de la realización de horas extraordinarias en descanso se gestionará a través de una bolsa de horas extraordinarias de carácter semestral de acuerdo con lo que se establece a continuación:</p><p class=\"lista-letra\">• Horas extraordinarias realizadas en el primer semestre: el disfrute de la compensación en descanso se realizará en el $2^{\\circ}$ semestre del año natural.</p><p class=\"lista-letra\">• Horas extraordinarias realizadas en el segundo semestre: se disfrutará la compensación en descanso en el 1º semestre del año siguiente.</p><p class=\"lista-letra\">• Si durante un mismo semestre la persona dispone de horas acumuladas, se podrán compensar en días de baja producción si la empresa lo oferta.</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\">La totalidad generada de todas ellas se cuantificarán una vez cerrado el semestre en curso (esto es, a finales de junio y a finales de diciembre), momento en el cual deberán calendarizarse las horas de la bolsa en función de los cupos disponibles y en fracciones mínimas de 1 hora. La empresa deberá informar en ese momento de los cupos, de la forma de solicitud y los plazos máximos para calendarizar las horas de esta bolsa. La compensación se realizará en días completos, computando las horas restantes a cupo de día completo, pudiendo modificarse los días planificados con 7 días de preaviso.</p><p class=\"parrafo-normal\">En el supuesto de que se los días calendarizados coincidan con bajas por nacimiento de menor, bajas por riesgo durante el embarazo, IT o AT, estos días se disfrutarán una vez finalizadas las situaciones indicadas y a continuación de estas.</p><p class=\"parrafo-normal\">El personal indefinido fijo discontinuo y el personal temporal por defecto compensarán las horas extraordinarias (incluidas las nocturnas y las festivas) económicamente, ya que por su tipología de contrato no resulta posible que se acojan a la bolsa semestral. No obstante esto, las personas con este tipo de contratos tendrán la opción de compensar las horas extraordinarias en tiempo de descanso dentro de los períodos de baja producción ofertados por la empresa.</p><p class=\"parrafo-normal\"><u>La gestión de la bolsa a partir de 2026 se realizará de la siguiente manera:</u></p><p class=\"lista-letra\">• Personal con contrato a tiempo completo:</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\">Desde el momento de la realización de la hora extraordinaria, la persona trabajadora deberá calendar el descanso compensatorio en días completos en los cuatro meses siguientes a la realización de la misma, con margen para disfrutarla dentro de todo el año natural. Si en el cuarto mes la persona no planifica el descanso, se le abonará automáticamente en la nómina del quinto mes. En el caso que no haya generado horas suficientes para cubrir un día completo, por defecto se realizará el pago de esas horas, salvo que la persona solicite expresamente por correo electrónico que sea la empresa quien le asigne la compensación en tiempo de esas horas en momentos de baja producción.</p><p class=\"parrafo-normal\">Las horas realizadas desde el 1 de septiembre hasta el 31 de diciembre de cada año deberán calendarse igualmente en los siguientes cuatro meses a la realización. El margen para el disfrute será hasta el 31 de agosto del año siguiente para el personal con contrato indefinido a tiempo completo, pudiendo planificarlas una vez se haya negociado el calendario laboral y garantizando un año completo para su disfrute.</p><p class=\"parrafo-normal\">Si durante el año en curso la persona quiere cambiar el sistema de compensación de las horas extraordinarias, esto es, pasar de compensación en descanso a compensación económica o viceversa, podrá hacerlo, siendo efectivo el cambio a partir de la fecha de solicitud. Para ello, lo anterior deberá quedar compensado en la bolsa o cobrado ya en nómina.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Personal acogido a reducción de jornada por guarda legal:</p><p class=\"parrafo-normal\">&nbsp;En relación con lo dispuesto en el artículo 25.8 del presente Acuerdo, el personal que disfrute de una reducción de jornada por guarda legal, siempre&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;que solicite voluntariamente la realización de horas extraordinarias por resultar compatible con su conciliación de la vida laboral y familiar, deberán&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;proceder a calendar y disfrutar el descanso compensatorio en días completos dentro de los cuatro meses a la realización de la misma. Si no lo hace&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;en plazo, la empresa le asignará su disfrute dentro del cuarto mes. El personal con reducción de jornada por guarda legal no podrá compensar la&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;realización de horas extraordinarias con dinero en ningún caso.</p><p class=\"parrafo-normal\"><br></p><p class=\"parrafo-normal\">La compensación se realizará por días completos de acuerdo con el cupo establecido pudiendo modificarse los días planificados con un mínimo de 7 días de preaviso.</p><p class=\"parrafo-normal\">Para los dos supuestos antes citados en los casos que los días calendados para compensación de horas extraordinarias coincidan con bajas por nacimiento de menor.</p><p class=\"parrafo-normal\">bajas por riesgo durante el embarazo, IT o AT, estos días se disfrutarán una vez finalizadas las situaciones indicadas y a continuación de estas.</p><p class=\"articulo-titulo\">Artículo 10.1. bis- Compensación de horas extraordinarias sueltas.</p><p class=\"parrafo-normal\">Cuando después de compensar en días completos las horas extraordinarias realizadas la persona siga teniendo horas extraordinarias sueltas a compensar, podrá disfrutarlas fuera de cupo con menos de 7 días de preaviso, si la producción lo permite, mediante solicitud al responsable o con la herramienta que se habilite para ello.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 11.- Horas extraordinarias festivas.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 11.- Horas extraordinarias festivas.</p><p class=\"parrafo-normal\">Las horas extraordinarias festivas son las horas extraordinarias realizadas en días señalados como festivos en el calendario laboral acordado entre las partes firmantes del presente Acuerdo. Se establecen dos maneras de compensación de las horas extraordinarias festivas:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;Económica: las horas extraordinarias festivas se retribuirán económicamente con un recargo sobre la hora ordinaria del 100%, tal y como se establece en las tablas salariales anexas al presente Acuerdo.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;Compensación en descanso: El personal indefinido podrá acogerse voluntariamente a la compensación de horas extraordinarias festivas por jornadas de descanso, compensándose 1 hora extra festiva con 2.25 horas de descanso. Se podrán modificar solicitándolo con 7 días de preaviso.</p><p class=\"parrafo-normal\">La compensación en descanso se realizará a través de la Bolsa de horas extraordinarias regulada en el artículo 10.1 de este acuerdo. No obstante, ello, aquella persona que haya escogido la opción de compensación de horas en tiempo de descanso y quiera, para el día que realice horas extraordinarias festivas, percibir la compensación económica o viceversa, podrá hacerlo comunicando su petición de cambio para ese día concreto a RRHH. Cada festivo que se realicen horas extraordinarias festivas se considerará una solicitud diferente y no implica la modificación de la elección anterior.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 12.- Horas extraordinarias nocturnas",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 12.- Horas extraordinarias nocturnas</p><p class=\"parrafo-normal\">Las horas extraordinarias nocturnas son las horas extraordinarias realizadas en el horario nocturno indicado en el artículo 8 del presente Acuerdo.</p><p class=\"parrafo-normal\">Se establecen dos maneras de compensar la realización de estas horas:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;Económica: El personal podrá percibir el importe que figura en el Anexo I, que supone la suma de los importes correspondientes a la hora extraordinaria y a la hora nocturna.</p><p class=\"parrafo-normal\">Compensación en descanso: el personal podrá acogerse voluntariamente a la compensación de horas extraordinarias nocturnas por jornadas de descanso, que se compensará 1 hora extra nocturna con 2 horas de descanso. La compensación en descanso se realizará a través de la Bolsa de horas extraordinarias regulada en el&nbsp;<span style=\"color: rgb(249, 250, 251); font-size: 0.875rem;\">artículo 10.1 de este acuerdo. Se escogerá el mismo método de compensación que la<b>&nbsp;</b><span style=\"font-size: 0.875rem;\">persona haya escogido para la compensación de horas extraordinarias.</p><p class=\"parrafo-normal\">El personal que realice turno nocturno no podrá realizar horas extraordinarias en el día que tenga horario nocturno planificado.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 13.- Anticipos de salario y préstamos.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 13.- Anticipos de salario y préstamos.</p><p class=\"parrafo-normal\">Se podrán solicitar anticipos de salario o préstamos en los términos establecidos en el presente artículo.</p><p class=\"articulo-titulo\">Artículo 13.1. Anticipo de Salario.</p><p class=\"parrafo-normal\">Se considerará anticipo todo aquel adelanto de salario que sea a cuenta de la nómina del mes en el que se solicite y/o de las pagas extraordinarias devengadas y aún no abonadas. Cómo máximo se podrá solicitar la totalidad de lo generado a fecha de su solicitud. La nómina del mes en curso se percibirá en la fecha que corresponda minorada, en todo o en parte según el caso, en los importes solicitados como anticipo;&nbsp;<span style=\"font-size: 0.875rem;\">igualmente ocurrirá en el momento de abono de las pagas extraordinarias, que se verán minoradas en la cuantía de los importes adelantados.</p><p class=\"parrafo-normal\">En caso de causar baja definitiva en la empresa, por cualquier razón, se detraerá la cantidad solicitada de la liquidación final.</p><p class=\"articulo-titulo\">Artículo 13.2 Préstamo.</p><p class=\"parrafo-normal\">El personal indefinido podrá solicitar un préstamo con las siguientes condiciones:</p><p class=\"lista-letra\">• Personal indefinido ordinario con más de 6 meses de antigüedad: podrá solicitar hasta 2.000€ en 18 cuotas&nbsp;</p><p class=\"lista-letra\">• Personal indefinido ordinario con más de 1 año de antigüedad: podrá solicitar hasta 4.000€ en 48 cuotas.</p><p class=\"lista-letra\">• Personal indefinido ordinario con más de 5 años de antigüedad: podrá solicitar hasta 8.000€ en 60 cuotas.</p><p class=\"parrafo-normal\">No se permiten amortizaciones parciales del importe solicitado. Si la persona trabajadora quiere amortizar la totalidad del préstamo realizará una transferencia a la cuenta bancaria que le facilitada por RRHH a tales efectos, debiendo aportar copia del justificante bancario de la transferencia para poder cancelar el préstamo en la contabilidad.</p><p class=\"parrafo-normal\">El personal con préstamos activos en el momento de la firma del acuerdo podrá solicitar un segundo préstamo de carácter excepcional en ese momento por la diferencia entre lo solicitado y el importe máximo acordado o amortizar el préstamo actual para solicitar uno nuevo.</p><p class=\"parrafo-normal\">En caso de extinción de la relación laboral, por cualquier causa, el importe del préstamo no devuelto se descontará de la liquidación de haberes que corresponda. En el caso de no ser suficiente para saldar la deuda el importe de la liquidación de haberes, ambas partes acordarán cómo se realizará la devolución; para el caso en el que no se llegue a acuerdo sobre la devolución, se procederá a la reclamación de la deuda como legalmente corresponda.</p><p class=\"parrafo-normal\">Al importe concedido se le aplicarán los intereses que legalmente correspondan.</p><p class=\"parrafo-normal\">Para poder solicitar un nuevo préstamo, se tendrá que haber cumplido con la obligación de haber devuelto el anterior.</p><p class=\"parrafo-normal\">La persona podrá revisan en INET el seguimiento del estado de su préstamo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
