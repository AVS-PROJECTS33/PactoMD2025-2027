<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador - Pacto MD 2025-2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <!-- Cabecera CCOO -->
    <header class="bg-[#FF5000] text-white shadow-md z-20 sticky top-0 flex-shrink-0">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <!-- Logo CCOO -->
                <div class="text-3xl font-black ccoo-logo">
                    CCOO
                </div>
                <div class="h-8 w-px bg-white/40 hidden sm:block"></div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold uppercase tracking-wide leading-tight">Pacto MD</h1>
                    <p class="text-sm text-white/90 font-medium">Buscador 2025-2027</p>
                </div>
            </div>
            <div class="w-full sm:w-96 relative">
                <input type="text" id="search-input" class="w-full py-2.5 px-10 rounded shadow-inner text-gray-900 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-[#FF5000] transition-all" placeholder="Buscar (ej. compensacion horas)...">
                <svg class="w-5 h-5 absolute left-3 top-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 bg-gray-100">
        <div class="max-w-5xl mx-auto">
            <div id="articles-container" class="space-y-3 pb-20">
                <!-- Los artículos se generarán aquí -->
            </div>
        </div>
    </main>

    <!-- Cargar los datos del pacto -->
    <script src="data/pacto.js"></script>
    
    <!-- Lógica de la aplicación -->
    <script src="js/app.js"></script>
</body>
</html>
