--tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">&nbsp;&nbsp;Acumulación de la reducción de jornada para períodos de vacaciones escolares (No cole).</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">&nbsp;<span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; color: rgb(156, 163, 175);\">• 3&nbsp;&nbsp;Excesos: semanas completas unidas al periodo de vacaciones asignadas (antes o después del periodo estival).</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">&nbsp;<span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; color: rgb(156, 163, 175);\">• 4&nbsp;&nbsp;Excesos: semanas completas de exceso sin unir al periodo estival.</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">&nbsp;<span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; color: rgb(156, 163, 175);\">• 5&nbsp;&nbsp;Excesos: solicitudes de días sueltos y puentes.</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">&nbsp;<span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; color: rgb(156, 163, 175);\">• 6&nbsp;&nbsp;Solicitudes de días con horas extraordinarias, bolsa negativa y reducción de jornada por edad.</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">&nbsp;<span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; color: rgb(156, 163, 175);\">• 7&nbsp;&nbsp;Permiso no retribuido.</p><p class=\"articulo-titulo\">Artículo 20.1.- Cupos</p><p class=\"parrafo-normal\">Junto con la negociación del calendario laboral, anualmente Empresa y Comité de Empresa acordarán los cupos máximos de personas que, por razones productivas y organizativas, puede asumir el centro. Los cupos que se acordarán serán los siguientes:</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\"><u>• Cupo de vacaciones:</u></p><p class=\"parrafo-normal\">Cupo por sección con distribución por semanas y teniendo en cuenta los bloques de dos semanas del periodo estival.</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp;&nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\"><u>• Cupo diario:</u></p><p class=\"parrafo-normal\">Cupo único que engloba todas las peticiones que van a días sueltos con: Días blancos (excesos), compensación de horas extraordinarias, y permiso no retribuido, (incluyendo durante 2025 las solicitudes de bolsa negativa a cargo de la persona trabajadora). Este cupo será por sección y si la producción lo permite, se podrá solicitar el cupo sobrante de otras secciones, mediante petición vía mail a RRHH.</p><p class=\"parrafo-normal\">La calendarización de las horas debe ser con un preaviso mínimo de 7 días naturales, a través de INET y por días completos; pudiendo calendarizar picos de horas sueltas bajo producción, fuera de cupo, con menos de 7 días de preaviso, mediante la persona responsable o la herramienta que se habilite para ello.</p><p class=\"parrafo-normal\">Cuando por motivos de producción, la empresa pueda ofrecer a la persona trabajadora la posibilidad de disfrutar horas o días de exceso o compensación de horas extraordinarias y siempre que a la persona le convenga, las horas indicadas a compensar podrán superar el cupo y no se requerirá de preaviso por parte de la persona y la empresa.</p><p class=\"parrafo-normal\">Para aquellos días que por cupo no hayan podido ser concedidos al trabajador o a la trabajadora, se generará una lista por orden de petición. Para poder generarse dicha lista, la persona deberá disponer de saldo de horas suficientes en su bolsa y solicitarlo por escrito en el momento de la solicitud. En el caso de generarse una plaza para ese día, se le propondrá al primero de la lista a quien se le concederá si continúa teniendo horas disponibles, o de lo contrario se le ofrecerá al siguiente, pasando el primero a la cola y así sucesivamente.</p><p class=\"parrafo-normal\">En relación con los días blancos del turno con prestación de servicios el domingo noche se estará a lo siguiente:</p><p class=\"lista-letra\">- El personal de este turno podrá planificar hasta 2 días de exceso dentro de la noche, sin merma salarial excluyendo el resto de las ausencias en este punto.&nbsp;<span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">En relación con el personal fijo discontinuo, podrá planificar la parte proporcional al tiempo trabajado, equivalente a 1 noche al año en lugar de 2.</p><p class=\"lista-letra\">- La empresa garantiza que todo el personal de este turno tendrá la posibilidad de planificar sus días de exceso según lo acordado. Y asimismo, en el caso de ampliar el personal en este turno, la empresa ampliará el cupo para garantizar lo anteriormente mencionado.</p><p class=\"lista-letra\">- En el caso de que existan vacantes temporales inferiores a 6 meses en este turno, entendiendo que es una vacante voluntaria y temporal vinculada a la presencia, la persona que la ocupe no accederá al cupo diario, o si accediese podría cogerlo sin la remuneración equivalente al importe estipulado de la noche no trabajada.</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp;<u><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp;Cupo de bolsa negativa:</u></p><p class=\"parrafo-normal\">Cupo único e independiente a total centro que engloba todas las peticiones de petición de horas de bolsa negativa que van tanto a días completos como horas sueltas. La asignación de las horas se realizará por orden de llegada.</p><p class=\"parrafo-normal\">La calendarización de las horas debe ser con un preaviso mínimo de 7 días naturales, pudiendo calendarizar dichas horas en el momento de realización de calendario laboral, como durante el resto del año.</p><p class=\"parrafo-normal\">Se podrán solicitar horas fuera de cupo, con menos de 7 días de preaviso, bajo producción, mediante la herramienta que se habilite para ello.</p><p class=\"parrafo-normal\">En relación con el sistema de cupos, las personas trabajadoras que realicen funciones diferenciadas a las habituales de operario/a de logística, o ejerzan esas funciones a modo backup, no podrán coincidir entre ellos/as (véase ejemplo: AP, Turno noche, apoyo JE, muestras, administración expediciones, administración entradas, decoración, factory, etc.).</p><p class=\"articulo-titulo\">Artículo 20.2.- Días de exceso.</p><p class=\"parrafo-normal\">La devolución de los días de exceso se realizará de acuerdo a los criterios regulados en el presente precepto mientras dure la vigencia de este Acuerdo.</p><p class=\"parrafo-normal\">En el cómputo de horas de exceso de jornada para planificar los días se tendrá en cuenta las horas de exceso generadas en el calendario anual, descontando tantas horas como las necesarias para generar 5 semanas de vacaciones, reducciones de jornada de navidad reguladas en el presente artículo y los puentes.</p><p class=\"parrafo-normal\">Si se planifica una semana de vacaciones que incluye un día laborable festivo, las horas generadas se sumarán al cómputo anterior. En el caso de modificar dicha semana, si se planifica en otra sin festivos, se deberán restar esas horas del saldo disponible. En el supuesto de no poder devolver estas horas, no podrá realizarse el cambio de vacaciones en ningún caso.</p><p class=\"parrafo-normal\">Del total de días de exceso que se generen anualmente se dará la opción a destinar uno de ellos para la realización de un puente. En la negociación del calendario anual, la Empresa y el Comité de Empresa, acordarán qué puentes se ofrecen a la plantilla para que esta pueda elegir uno de ellos a libre elección. El departamento de RRHH podrá concederlo siempre y cuando se cumplan los cupos establecidos.</p><p class=\"parrafo-normal\">El resto de los días de exceso se designarán en el calendario laboral de la persona trabajadora en jornadas completas bajo los criterios recogidos en el artículo 20.1 Cupos.</p><p class=\"parrafo-normal\">La persona trabajadora puede elegir si calendar los días blancos a principio de año o bien más adelante, guardándolos en una bolsa hasta las fechas límite para marcarlos.</p><p class=\"parrafo-normal\">No obstante ello, una vez fijados en el calendario, la persona puede hacer cambios de los mismos que estarán sujetos a cupo y deberán solicitarse con una antelación mínima de 7 días. Si al día 31 de octubre no se han calendarizado todos los días de exceso y el pico de horas restante del año natural, las fechas las marcará la empresa de manera inamovible durante el mes de enero del año siguiente.</p><p class=\"parrafo-normal\">Los días 24 y 31 de diciembre, el personal que presta servicios a tiempo completo podrá solicitar de manera voluntaria en el momento de la solicitud de vacaciones, la prestación de servicios efectivos de solamente 4 horas, compensando las otras 4 horas de jornada ordinaria con 4 horas de días de exceso (horas de exceso), siempre y cuando ambos días coincidan con días laborables. El personal con reducción de jornada por guarda legal o personal que preste servicios a tiempo parcial, les resultará de aplicación lo recogido en este párrafo de forma proporcional a su jornada laboral para los dos dias señalados. No se aceptarán solicitudes fuera de plazo.</p><p class=\"parrafo-normal\">En el supuesto de que se los días calendados coincidan con bajas por nacimiento de menor, bajas por riesgo durante el embarazo, IT o AT, estos días se disfrutarán una vez finalizadas las situaciones indicadas y a continuación de estas. En el caso de que la persona que, teniendo días calendarizados, no prevé incorporarse, tendrá la opción a desplanificar los días para liberar el cupo disponible para el resto del personal, hasta 7 días antes del disfrute previsto.</p><p class=\"parrafo-normal\">En el caso de los días de exceso generados durante el año se deberán compensar antes del 31 de diciembre del año en curso. Éstos se podrán disfrutar unidos o separados de cualquiera de los periodos vacacionales planificados.</p><p class=\"parrafo-normal\">En el caso del personal que modifique su jornada durante el año:</p><p class=\"lista-letra\">• Para el personal que cambia a jornada parcial de manera voluntaria, en el momento del cambio, se actualiza el calendario y se informa a la persona de sus horas de exceso actualizadas.</p><p class=\"lista-letra\">• Para el personal que se acoge a los cambios de jornada voluntarios ofertados por la empresa (32h-40h): Una vez finalizado el año, se recalculan los excesos de cada persona teniendo en cuenta las diferentes ampliaciones realizadas durante el año.</p><p class=\"parrafo-normal\">En el caso de que personas que hayan generado más horas de exceso tras el recálculo se ofrece poderlas calendarizar durante el primer trimestre del año siguiente.</p><p class=\"articulo-titulo\">Artículo 20.2 Bis. Planificación de excesos en semanas completas.</p><p class=\"parrafo-normal\">El personal podrá planificar una semana entera con los días de exceso, siempre que sea posible planificar una semana completa y sin necesidad de que esa semana completa se una al período de vacaciones asignado, priorizando la planificación por semanas a la hora de abrir el cupo y, después, planificando los días sueltos con el cupo sobrante. Todo ello siempre supeditado a cupo y a las necesidades productivas y asignándose por orden de petición.</p><p class=\"parrafo-normal\">Asimismo, se permitirá unir semanas de exceso al periodo estival (antes o después del periodo asignado), de acuerdo con el cupo y el orden de prioridades establecido. La empresa garantizará que el cupo diario sea suficiente para cubrir este punto.</p><p class=\"parrafo-normal\">En los casos en que la solicitud no sea aceptada en la asignación de la semana de excesos por delante de sus vacaciones, podrá escoger hacerla por detrás si hubiera cupo, o viceversa, bajo petición de la persona.</p><p class=\"parrafo-normal\">Para aquellas jornadas que no generen suficientes horas de exceso para poder cubrir una semana completa, si desean solicitar toda la semana se podrán unir tantos días como sea necesario para poder cubrir la semana, completando esos días con compensación de horas extras, bolsa negativa, o permiso no retribuido. En el caso de no querer cubrirlo de esta manera, y no cubrir la semana completa, deberá realizarlo en el momento de la petición de días sueltos. Solamente será de aplicación la semana completa si utiliza todos sus excesos para este fin, si la persona utiliza parte de los excesos para otro día y con el restante no genera una semana completa, no podrá solicitar la semana.</p><p class=\"articulo-titulo\">Artículo 20.3.- Bolsa negativa de horas</p><p class=\"parrafo-normal\">Se acuerda la creación de una bolsa de horas en negativo por la que resulte posible que la persona trabajadora pueda no prestar servicios efectivos planificados en su calendario, debiendo recuperar esas horas en momentos de mayor producción.</p><p class=\"parrafo-normal\">Se acuerda con la negociación del calendario laboral anual la creación de un cupo para las horas de la bolsa en negativo de total centro, ya sean horas sueltas o días completos, y se gestionará a través de una herramienta de nueva creación independiente al calendario de INET.</p><p class=\"parrafo-normal\">La gestión de la bolsa se hará como se indica a continuación:</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<u>• Si la petición es de la persona trabajadora:</u></p><p class=\"parrafo-normal\">Se asignará bajo un cupo único e independiente a total centro, con compensación de hora por hora, con un límite por persona de 48 horas anuales (y 30 horas anuales para cualquier jornada parcial o reducciones de jornada por guarda legal), con el fin de garantizar la recuperación de las mismas y el disfrute de esta flexibilidad por todas las personas trabajadoras. La persona trabajadora podrá calendar estas horas con el calendario laboral anual o durante el año en curso.</p><p class=\"parrafo-normal\">Si a final de año la persona no ha devuelto la totalidad de las horas, se descontará la cantidad en la nómina de enero.</p><p class=\"parrafo-normal\">No se podrá superar el tope máximo indicado de horas aun habiendo ya recuperado las horas solicitadas.</p><p class=\"lista-letra\"><u>• Si la petición es de la empresa:</u></p><p class=\"parrafo-normal\">La empresa podrá solicitar que la persona que no trabaje un día determinado, bien una jornada completa o bien horas sueltas. La persona trabajadora&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; podrá acceder voluntariamente o bien rechazar la oferta, sin tiempo mínimo establecido en la oferta, tanto para días completos como horas sueltas.</p><p class=\"parrafo-normal\">En el caso de que acepte esta solicitud, la recuperación de las horas se hará se hará con la equivalencia de 1,5 de descanso por 1 hora trabajada por 1,5h,&nbsp; &nbsp; &nbsp; con un máximo de 48h por persona y 30h para cualquier jornada parcial y reducciones de jornada por guardia legal. Una vez superado el tope máximo anterior, aun habiendo recuperado las horas solicitadas, a partir de la hora 49 entraría en una bolsa ilimitada con una conversión de 1h trabajada por 1,75h de descanso.</p><p class=\"parrafo-normal\">Las solicitudes deben realizarse con un mínimo de a 7 días naturales de antelación. En el caso de solicitudes con menos de 7 naturales días de preaviso, así como dentro del mismo día, se concederán bajo producción, independientemente del cupo existente, a través de la herramienta que se cree para ello y se aceptará dentro del mismo periodo.</p><p class=\"parrafo-normal\">El periodo de recuperación será desde el 1 de enero hasta el 31 de diciembre del año en curso.</p><p class=\"parrafo-normal\">La recuperación de las horas se realizará en los momentos de producción ofertados por la empresa fuera de su jornada, en fracciones minimas de 1h y pudiendo alcanzar las 9,5h máximas de jornada diaria, aún entrando en horario nocturno, en sábados y domingos, y los festivos de manera voluntaria (en este caso la persona podrá elegir la opción de recuperación de bolsa negativa o compensación del festivo en cobro o tiempo).</p><p class=\"parrafo-normal\">En el caso de recuperación, si una persona tiene a devolver horas a su cargo y a cargo de la empresa, se priorizarán estas últimas, pues son las que la empresa tiene obligación de ofertar en su totalidad antes de finalizar el año.</p><p class=\"parrafo-normal\">La persona trabajadora, los días que la empresa realiza la solicitud, tendrá la opción de acogerse o tendrá la opción de utilizar la compensación de las horas extras si las tiene acumuladas, así como horas de exceso disponibles si así lo solicita.</p><p class=\"parrafo-normal\">Si finalizado el periodo de recuperación a 31 de diciembre del año en curso, por el motivo que fuese, la persona no ha recuperado las horas descansadas, no cumpliendo así con la jornada anual pactada, se procedería al descuento de las horas restantes en la nómina del mes de enero.</p><p class=\"parrafo-normal\">Si para la recuperación de las horas solicitadas por la empresa, ésta no ha podido ofertar la devolución de al menos el mismo número de horas a recuperar que debe la persona por motivos organizativos y/o productivos, no podrá descontar las horas no ofertadas en nómina. Para el cómputo, no se tendrán en cuenta las solicitudes de recuperación preavisadas en el mismo día.</p><p class=\"parrafo-normal\">Una vez aceptada la calendarización de estas horas, la empresa no podrá anularlas aun habiendo producción.</p><p class=\"parrafo-normal\">La persona, tanto si ha realizado la devolución de las horas como si no ha empezado a devolver, puede modificar la fecha asignada pero siempre sujeta al cupo existente.</p><p class=\"parrafo-normal\">Si las horas calendadas coinciden con periodo de baja médica, si no se han recuperado ninguna de estas horas, la petición quedaría anulada, si por el contrario ya se ha iniciado la recuperación, se disfrutaría el descanso de las horas ya recuperadas en la reincorporación de la persona trabajadora como el resto de las ausencias que coinciden con la IT/AT. Sólo es posible anular la calendarización en el caso de que no se haya empezado a devolver las horas.</p><p class=\"parrafo-normal\">El personal especialmente sensible que no pueda realizar prolongación de su jornada laboral no puede acogerse a esta medida.</p><p class=\"parrafo-normal\">La empresa hará entrega a la RLPT de forma trimestral el estado de la bolsa de horas negativa: horas totales solicitadas y horas pendientes de recuperar.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 21.- Vacaciones.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 21.- Vacaciones.</p><p class=\"parrafo-normal\">Se acuerda realizar la distribución del periodo vacacional distribuidas en 5 semanas de la siguiente manera:</p><p class=\"parrafo-normal\">Opción A:</p><p class=\"lista-letra\"><u>• 2 semanas en periodo de verano</u> (14 días) consecutivas y dentro de los bloques de dos semanas establecidos dentro del calendario anual pactado.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<u>•&nbsp;</u><u>3 semanas en periodo de invierno</u> (19 días que se componen de: 17 dias de vacaciones restantes + 2 días blancos \"excesos\"). Siendo el mínimo&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; exigible:</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; - 2 semanas planificadas entre los meses de enero y mayo, pudiendo disfrutar las semanas juntas o separadas.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; - 1 semana entre los meses de octubre a diciembre.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;- Opción de disfrutar las 3 semanas juntas o separadas en el primer periodo (enero a mayo) a voluntad de la persona trabajadora.</p><p class=\"parrafo-normal\">Opción B: Adelantar vacaciones al primer semestre:</p><p class=\"lista-letra\">• Opción de adelantar semanas con disfrute en el primer semestre pudiendo llegar a calendarizar la totalidad de 5 semanas entre enero y mayo.</p><p class=\"lista-letra\">• Opción de dividir el bloque estival en dos semanas independientes, siempre y cuando una de ellas se mantenga en el bloque escogido de verano, (aun partiendo el cupo se mantiene para el bloque completo) y pasando la otra semana al primer periodo (enero a mayo).</p><p class=\"parrafo-normal\">En el caso de que un turno de vacaciones sea solicitado de forma mayoritaria, su adjudicación se realizará de la siguiente manera:</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; • En el caso de que el turno solicitado esté completo, tendrán preferencia para el disfrute de este las personas que no lo hayan disfrutado o&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;calendarizado el año anterior.</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">• Si continúa habiendo discrepancia, tendrán preferencia las personas que no lo hayan disfrutado en los dos últimos años, y así sucesivamente.</p><p class=\"lista-letra\">• En el caso de que el turno solicitado esté completo y no existan coincidencias con años anteriores, se asignará teniendo en cuenta la antigüedad.</p><p class=\"lista-letra\">• En el caso de que la elección de vacaciones del/la trabajador/a no pueda ser aceptada y se escoja otra fecha, esta segunda elección se aceptará siempre y cuando otra persona dentro del cupo no haya escogido esta misma fecha como primera opción.</p><p class=\"parrafo-normal\">En caso de matrimonio o establecimiento de pareja de hecho debidamente inscrita en los registros oficiales habilitados al efecto se podrán juntar los días de permiso retribuido correspondientes con un periodo de vacaciones, en semanas completas, a elección del personal.</p><p class=\"parrafo-normal\">Cuando concurra una situación de incapacidad temporal o un permiso de nacimiento de hijo/hija con un período vacacional, se estará a lo que legalmente se establezca. En el supuesto de que se tenga derecho al disfrute posterior de los días de vacaciones concurrentes, estos días de vacaciones se disfrutarán una vez finalizadas las situaciones indicadas y a continuación de estas, aunque haya finalizado el año natural en los términos legalmente establecidos.</p><p class=\"parrafo-normal\">Una vez cuadradas las vacaciones de la plantilla, la empresa entregará al comité de empresa el detalle de vacaciones de cada trabajador/a.</p><p class=\"parrafo-normal\">En los siguientes casos, el personal tendrá derecho a adelantar días de vacaciones:</p><p class=\"parrafo-normal\">➤ El personal podrá modificar el turno vacacional de invierno en función de la disponibilidad de vacantes en otros turnos preavisando a RRHH con 7 días de antelación.</p><p class=\"parrafo-normal\">➤ El personal, después de haber disfrutado el permiso correspondiente y siempre que siga existiendo el hecho causante del mismo, podrá solicitar <u>días sueltos de vacaciones con justificación y sin preaviso</u> por los siguientes motivos:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;Fallecimiento de familiar de primer o segundo grado de consanguinidad.&nbsp;</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;• Hospitalización, intervención y enfermedad de familiar de primer y segundo grado de consanguinidad.&nbsp;</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;• Por cuidado de familiares de primer grado de consanguinidad o cónyuge.</p><p class=\"parrafo-normal\">➤ El personal, después de haber disfrutado el permiso correspondiente y siempre que siga existiendo el hecho causante del mismo, podrá solicitar <u>días sueltos de vacaciones con justificación y con un preaviso de 7 días</u> a RRHH en los siguientes casos:</p><p class=\"lista-letra\">• Permiso retribuido por boda de familiar de primer o segundo grado de consanguinidad.</p><p class=\"lista-letra\">• Para exámenes prenatales y técnicas de preparación al parto para ambos progenitores.</p><p class=\"lista-letra\">• Por traslado de domicilio.</p><p class=\"lista-letra\">• Para exámenes oficiales.</p><p class=\"lista-letra\">• Para la asistencia a festivales escolares.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },

    "contentHtml": "<p class=\"articulo-titulo\">CAPITULO IV.- LICENCIAS, PERMISOS, EXCEDENCIAS Y</p>\n<p class=\"parrafo-normal\">CONCILIACIÓN VIDA LABORAL Y FAMILIAR</p>"
