  {
    "title": "Artículo 14.- Clasificación Profesional.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 14.- Clasificación Profesional.</p><p class=\"parrafo-normal\">La clasificación profesional aplicable a la Empresa se encuentra regulada en el convenio colectivo provincial de comercio textil de Barcelona.</p><p class=\"parrafo-normal\">A estos efectos, la denominación de mozo pasará a ser la de \"operario/a de logística\". Y en este sentido, dentro del Grupo Profesional IV del convenio colectivo citado se incluirán los siguientes puestos de trabajo/categorías:</p><p class=\"parrafo-normal\"><b><u><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;Grupo Profesional I.</u> </b>Criterios Generales.</p><p class=\"parrafo-normal\">Se incluyen en este grupo aquellas personas trabajadoras que realicen funciones siguiendo un método de trabajo preciso y concreto que requiera la supervisión del superior jerárquico.</p><p class=\"parrafo-normal\">Se consideran dentro de este Grupo Profesional, las siguientes categorías:</p><p class=\"parrafo-normal\"><b><u><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;Operario/a logística.</u></b>&nbsp;</p><p class=\"parrafo-normal\">Se incluye el operario/operaria que realicen funciones siguiendo un método de trabajo preciso y concreto, precisando la supervisión del superior jerárquico, realizando las tareas propias de almacén como la recepción, la preparación y la expedición de la mercancía, haciendo el traslado de los mismos por sus propios medios o utilizando elementos mecánicos, y que exige conocimientos profesionales de carácter elemental, con posible utilización de elementos electrónicos tales como lectores, escáneres, etc.</p><p class=\"parrafo-normal\">Transcurrido el plazo de prestación de servicios efectivos de 24 meses acumulados en Massimo Dutti Logística SA con la categoría de operario u operaria, recibiendo formación y acumulando experiencia, tras este periodo pasarán a la categoría de operario u operaria especialista de logística, enmarcado en el grupo II.</p><p class=\"parrafo-normal\"><b><u><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;Grupo Profesional II.</u></b> Criterios generales.</p><p class=\"parrafo-normal\">Se incluye en este grupo aquellos trabajadores que realicen funciones consistentes en la ejecución de operaciones que, aun cuando se realicen bajo instrucciones precisas, requieran adecuados conocimientos profesionales y aptitudes prácticas, pudiendo implicar la utilización de medios informáticos a nivel de usuario y cuya responsabilidad está limitada por un superior directo.</p><p class=\"parrafo-normal\">Se consideran dentro de este Grupo Profesional las siguientes categorías:</p><p class=\"lista-letra\"><u>• Operario/a de logística especializado/a.</u> Es el operario/operaria que se dedica a trabajos concretos, determinados y especializados que, requieren de autonomía, iniciativa y cierta habilidad en su ejecución dentro de las labores propias de almacén.</p><p class=\"lista-letra\"><u>• Operario/a de logística torista.</u> Es el operario/operaria de logística que dedica, como mínimo, el 90% de su jornada a manejar carretillas contrapesadas elevadoras de ruedas grandes.</p><p class=\"parrafo-normal\">Dentro de estos grupos profesionales se pueden desempeñar los siguientes puestos:</p><p class=\"lista-letra\"><u>• Operario/a Segundo de sección</u>: Es el operario/operaria de logística que, al frente del personal con las categorías de operario/a; operario/a especializado y operario/a Torista, si lo hubiere, coordina el trabajo de éstos y cuida de su disciplina y rendimiento, pudiendo implicar la utilización de medios informáticos a nivel de usuario, bajo la supervisión y directrices directamente del superior jerárquico.</p><p class=\"lista-letra\"><u>• Operario/a Asistente Producción</u>: Es el Operario/Operaria de logística que, dentro sus funciones de operario/operaria y habiendo recibido la formación e información correspondiente por parte de la empresa, realiza una serie de tareas que se encuentran dentro de sus competencias tales como la reposición de consumibles (precintadoras, etiquetadoras, aplicadoras, formadoras de cajas, hornos, etc.), el control de atascos en transportadores y máquinas auxiliares, el control de descarga en el clasificador de paquetería y todo ello bajo la supervisión directa del superior jerárquico.</p><p class=\"lista-letra\"><u>• Operario/a Apoyo Automatista</u>. Es el operario/operaria de logística que bajo la supervisión y coordinación de un automatista se dedica a trabajos concretos y especializados que, requieren de autonomía, iniciativa y cierta habilidad en su ejecución dentro de las labores propias de almacén, pudiendo implicar la utilización de medios informáticos a nivel de usuario y cuya responsabilidad está limitada por un superior directo.</p><p class=\"parrafo-normal\">La persona que realice estas funciones podrá a adquirir la categoría de automatista en el momento en el que deje de tener supervisión de las funciones estipuladas para su categoría y exista una vacante para ese puesto.</p><p class=\"lista-letra\"><u>• Operario especialista con Tareas Específicas.</u> Es el operario/operaria de logística que realiza tareas concretas de forma autónoma siendo el responsable de las tareas asignadas, interactuando con otros departamentos de la empresa y, en algunos casos, utilizando medios informáticos a nivel de usuario y cuya responsabilidad está limitada por un superior directo al que tienen que reportar.&nbsp;</p><p class=\"lista-letra\"><span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">En concreto tiene esta categoría el personal que realiza las siguientes tareas:</p><p class=\"lista-letra\"><span style=\"font-size: 0.875rem;\">•&nbsp;Tareas de decoración: abarcan tareas como recepción de mercancía.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; (Decoración, SSGG y Comunicación), Comprobación de packing.&nbsp;<span style=\"font-size: 0.875rem;\">Preparación de los pedidos en función de las salidas, Carga de los pedidos&nbsp;</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•<span style=\"font-size: 0.875rem;\">&nbsp;Tareas de gestión, clasificación y preparado de pedidos de artículos prototipos, muestras, pedidos especiales, tailoring y outlets: recepción de&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; mercancía. (Decoración, SSGG y Comunicación, Factory), Comprobación de packing, Preparación de los pedidos en función de las salidas, Carga de&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; los pedidos.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 15.-. Jornada Anual.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 15.-. Jornada Anual.</p><p class=\"parrafo-normal\">La duración de la jornada de trabajo durante el año 2025 será de 1.760 horas anuales de trabajo efectivo.</p><p class=\"parrafo-normal\">Para los años 2026 y 2027 la jornada laboral será de 1.752 horas anuales de trabajo efectivo, esto es, se reduce la jornada anual en 8 horas. Esta reducción de horas anuales se acumulará a las horas de excesos disponibles para el personal.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 16.- Turnos de trabajo.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 16.- Turnos de trabajo.</p><p class=\"parrafo-normal\">Para la prestación de servicios propios del almacén, se establecen los siguientes turnos fijos de trabajo:</p><div class=\"overflow-x-auto mb-6 mt-2\"><table class=\"w-full text-sm text-left border-collapse border border-gray-300 shadow-sm\"><tbody><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turno de mañana</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Horario de 06:00h a 14:00h</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turno partido</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Horario de 08:00 a 17:00h</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turnos partidos tarde</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Horario de 09:00h a 18:00h  Horario de 10:00h a 19:00h</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De domingo a jueves de 14:00h a 22:00h</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turnos de tarde</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De lunes a jueves 14:00h a 22:00h y viernes 10:00h a 19:00h</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turnos con horarios nocturnos hasta la firma del acuerdo</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Lunes de 00:00h a 8:00h y el resto de la semana:</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turnos diurnos con horarios nocturnos</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turno de mañana, partido, partido tarde o rotativo</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Domingo de 22:00h a 6:00h y el resto de la semana:  Turno de mañana, partido o partido tarde</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3\" colspan=\"2\"></td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turnos con horarios nocturnos a partir de la firma del acuerdo</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turnos diurnos con horarios nocturnos</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Domingo de 22:00h a 6:00h y el resto de la semana:</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turno de mañana, partido o partido tarde</td></tr></tbody></table></div><p class=\"parrafo-normal\">El colectivo de AP Y segundo/a de sección pueden rotar en función de los turnos establecidos en el presente artículo.</p><p class=\"parrafo-normal\">Para el personal que realiza turno diurno con horario nocturno, en el caso de que por efecto del calendario el lunes con horario nocturno (noche de domingo al lunes) coincida con un festivo en que el centro esté cerrado, el turno empezará el siguiente día laborable, de manera que se inicie la semana laboral en horario de noche. Excepcionalmente esto no sería de aplicación para los supuestos en los que se abra el centro el día festivo por necesidades organizativas y productivas. Este punto será de aplicación tanto para el personal indefinido con turno de noche como para el personal indefinido que se acoja a la vacante de manera temporal.</p><p class=\"parrafo-normal\">Para poder garantizar la organización de la empresa sin ver mermada la producción, la necesidad de la empresa para las jornadas laborales antes indicadas con horario nocturno es de 8 horas cada jornada. En el caso de que el festivo coincida con lunes (noche del domingo al lunes) y se precise mover la noche al martes (noche del lunes al martes), para los casos que afecte al personal con reducción de jornada por guarda legal, y para poder garantizar que este personal pueda tener acceso también a prestar servicios ese día que se mueve las 8 horas necesarias, las horas que realicen de más sobre el horario teórico de una semana normal, se le devolverán en forma de horas de exceso y podrán disfrutarlas conforme a lo establecido para este tipo de horas.</p><p class=\"articulo-titulo\">Artículo 16.1.- Permuta de turno</p><p class=\"parrafo-normal\">El personal afectado por el presente pacto podrá solicitar una permuta de turno con otro/a compañero/a por un periodo máximo de 8 semanas durante el año natural.</p><p class=\"parrafo-normal\">Para la realización de la permuta será necesario cumplir los siguientes requisitos:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;La permuta se realizará entre el personal con la misma jornada anual, categoría profesional y que puedan realizar las mismas funciones.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;Se podrá hacer la permuta entre personas que cumplan estos requisitos y que se encuentren inscritas en la lista de cambio de turno voluntario.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;La concesión de la permuta de turno estará condicionada a que se cumplan los períodos mínimos de descanso entre jornadas legalmente establecidos.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;La petición deberá realizarse por ambas partes con un mínimo de antelación de una semana.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;El uso de dicha permuta no debe coincidir con vacaciones ni horas de exceso por ambas partes.</p><p class=\"parrafo-normal\">En el caso de no encontrar permuta con compañeros/as de la misma sección se valorará el cambio entre compañeros/as de distintas secciones siempre que la operativa lo permita.</p><p class=\"articulo-titulo\">Artículo 16.2.- Cambio de horario por consulta médica.</p><p class=\"parrafo-normal\">El personal podrá solicitar un cambio de horario para poder asistir a consultas o pruebas médicas propias o de familiares de primer grado de consanguinidad con especialistas de la Seguridad Social o de centros privados para el mismo día de la visita, siempre y cuando el horario de la visita médica sea coincidente con el regulado en la sección y la operativa del centro logístico lo permita, y que dicho cambio suponga que la persona pueda acudir a la visita sin merma de tiempo efectivo de trabajo.</p><p class=\"parrafo-normal\">Se deberá solicitar al departamento de Recursos Humanos para su concesión y gestión con una antelación mínima de 7 días y se deberá presentar el justificante de visita.</p><p class=\"articulo-titulo\">Artículo 16.3.- Cambio de turno voluntario.</p><p class=\"parrafo-normal\">Se acuerda el procedimiento de cambio de turno voluntario quedando de la manera que se regula en el presente precepto.</p><p class=\"parrafo-normal\">Si debido a las necesidades del centro surge una vacante dentro de uno de los turnos establecidos en el centro, el personal podrá solicitar un cambio de turno de carácter voluntario, cumpliendo los requisitos que se contemplan en el presente artículo. Los requisitos para la solicitud del cambio de turno voluntario son los siguientes:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp;•&nbsp;La solicitud deberá ser presentada en el departamento de RRHH del 1 al 15 de octubre de cada año&nbsp;</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp;•&nbsp;Ser trabajador/a con contrato indefinido.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp;•&nbsp;En la solicitud se indicará el turno al que la persona quiera acceder.</p><p class=\"parrafo-normal\">Para la concesión del citado cambio de turno se atenderá a los siguientes criterios y en el siguiente orden, lo que será determinante en caso de empate:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp;•&nbsp;Fecha de presentación de la solicitud.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp;•&nbsp;Antigüedad en el turno de origen.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp;•&nbsp;Antigüedad en Massimo Dutti Logística S.A.</p><p class=\"parrafo-normal\">Estos cambios de turno de carácter voluntario se publicarán en el tablón de la Empresa durante la segunda quincena de octubre de cada año, respetando año tras año la fecha de solicitud para la elaboración de la lista definitiva, que será recalculada anualmente.&nbsp;</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">A la persona que se le conceda el cambio de turno, se le respetará el calendario anual de vacaciones.</p><p class=\"parrafo-normal\">En el caso de que el solicitante del cambio de turno de carácter voluntario rechace el equipo de destino asignado, no perderá su puesto en la lista de cambio de turno. En el caso de que se pudiera asignar un nuevo equipo por una segunda vez a una misma persona, si ésta rechazase por segunda vez la nueva opción, en este caso perdería su posición en la lista de cambio de turno, situándose al final de la misma.</p><p class=\"parrafo-normal\">Se generarán diferentes listas de cambio de turno según los turnos de trabajo que haya en el centro, creándose una lista por cada uno de los turnos de destino.</p><p class=\"parrafo-normal\">Se considera vacante aquella posición que sea necesario sustituir.</p><p class=\"parrafo-normal\">Se cubrirá cada vacante con una persona trabajadora independientemente de su jornada laboral.</p><p class=\"parrafo-normal\">Se limitará el número de personas por sección que pueden cambiar a otra sección simultáneamente, con la finalidad de no mermar la sección de origen.</p><p class=\"parrafo-normal\">Todo el personal podrá solicitar un cambio de turno voluntario, incluido el personal del turno de noche, independientemente del turno de origen al cual pertenezca.</p><p class=\"parrafo-normal\">Para la elección del turno solo se podrá optar a elegir un solo turno, en el caso de recibir solicitud de un nuevo turno, causará baja automáticamente la anterior solicitud.</p><p class=\"parrafo-normal\">Cuando en un mismo turno se produzca la baja definitiva en el mismo de 5 personas, se puede dar la opción de cambio voluntario de turno a la primera persona adscrita a la bolsa de cambio del turno en cuestión.</p><p class=\"articulo-titulo\">Artículo 16.3.1.- Cambio de turno voluntario: Turno de noche:</p><p class=\"parrafo-normal\">En el caso de acogerse al turno de noche, no será necesario esperar a las fechas pactadas y se podrá realizar la solicitud mediante un correo a RRHH en cualquier momento del año, quien dará respuesta o le incluirá en la lista para futuras vacantes.</p><p class=\"parrafo-normal\">El personal podrá acogerse de manera permanente o temporal a elección de la persona.&nbsp;<span style=\"font-size: 0.875rem;\">En caso de escoger el cambio temporal, cada 6 meses (a 31 de enero y 31 de julio), empresa y trabajador/a revisarán la continuidad en dicho turno.</p><p class=\"parrafo-normal\">La empresa informará de las nuevas incorporaciones al turno a la RLPT en la documentación mensual.</p><p class=\"articulo-titulo\">Artículo 16.3.2.- Cambio de turno voluntario temporal</p><p class=\"parrafo-normal\">Se acuerda cubrir el 50% de las vacantes temporales con las personas de la lista de cambio de turno, siempre y cuando acepten la rotación total centro y vuelvan a su turno origen una vez terminada la sustitución. Si tras el ofrecimiento de la vacante temporal la persona trabajadora lo rechaza, no perderá su puesto en la lista de cambio de turno. No obstante, si esta misma persona rechazase un segundo ofrecimiento de una vacante temporal en otro turno, en este caso sí perderá su puesto en la lista de cambio de turno y pasará a la última posición de la misma.</p><p class=\"parrafo-normal\">Cuando a una persona se le conceda un cambio de turno temporal, a este se le deberá conceder la vacante de cambio de turno indefinido que surja, dejando libre la vacante temporal que deberá asumir la siguiente persona de la lista.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },

    "title": "Artículo 17.- Descansos de jornada",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 17.- Descansos de jornada</p><p class=\"parrafo-normal\">Se establecen los descansos que se muestran en la siguiente tabla para cada uno de los turnos del centro, que serán computados como trabajo efectivo, esto es a cargo de la empresa, y que se disfrutarán en dos períodos dentro de los horarios establecidos a continuación:</p><div class=\"overflow-x-auto mb-6 mt-2\"><table class=\"w-full text-sm text-left border-collapse border border-gray-300 shadow-sm\"><tbody><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turno  Descanso</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Franja 1r descanso</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Franja 2º descanso</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">40 min  06:00H-14:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 08:30H-09:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min  De 11:30H12-:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">08:00H-17:00H  30 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 08:30H-09:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min  De 11:30H-12:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">10 min</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">30 min  09:00-18:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 10:30h11-:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min  De 15:30H16-:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">10 min</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">10:00H-19:00H  30 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 10:30H11-:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">10 min  De 15:30H16-:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">40 min  14:00H-22:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 15:30H-16:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min  De 19:30H-20:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">40 min  22:00H-06:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 00:30H-01:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min  De 03:30H-04:30H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">DESCANSOS REDUCCIÓN DE JORNADA  2025</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">2026/2027</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Jornadas intensivas 7h</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">30 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">40 min (20 + 20)</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Jornadas partidas 7h</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">30 min&nbsp;<span style=\"background-color: rgb(55, 65, 81);\">(20 + 10)</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Jornadas intensivas de 6 a 7h</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">25 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">35 min&nbsp;<span style=\"background-color: rgb(55, 65, 81);\">(20 + 15)</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Reducciones inferiores a 6h</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">15 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Reducciones inferiores a 3,5h</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">10 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">15 min</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\"></td></tr></tbody></table></div><p class=\"parrafo-normal\">El descanso del personal con reducción de jornada indicado en el cuadro anterior no será necesario que realice la pausa en el mismo horario que las jornadas completas, sino que se definirá en función del horario que realice.</p><p class=\"parrafo-normal\">Cualquier modificación en cuanto a los descansos y franjas horarias para realizarlos se pactará con el comité de empresa.</p><p class=\"articulo-titulo\">Artículo 17.1.- Tiempos de descanso con horas extraordinarias</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;El personal que realice una jornada partida y que realice 6 o más horas seguidas de trabajo, disfrutará de 5 minutos más de descanso, teniendo este tiempo consideración de tiempo efectivo de trabajo, pudiéndose disfrutar junto con el descanso establecido.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;En aquellos días en los que se realice hora y media de jornada extraordinaria a continuación de la jornada ordinaria, con horario intensivo a jornada completa, se acuerda realizar un descanso de 10 minutos, pudiéndose disfrutar junto con el descanso establecido. En el caso de que la oferta de horas extraordinarias se produzca una vez finalizados los descansos establecidos, realizará una tercera pausa.</p><p class=\"articulo-titulo\">Artículo 17.2.- Descanso de jornada en días especiales.</p><p class=\"parrafo-normal\">Durante la jornada laboral de los días 24 y 31 de diciembre, o en su defecto en los días que así se acuerden en la negociación del calendario laboral, el tiempo de descanso será el correspondiente al horario teórico de ese día de la persona trabajadora.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },

    "title": "Artículo 18.- Reducción de la jornada en función de la edad.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 18.- Reducción de la jornada en función de la edad.</p><p class=\"parrafo-normal\">Se establece una reducción de la jornada anual según la siguiente tabla en función de la edad de la persona trabajadora, no viéndose afectado el salario, hasta alcanzar la edad legal de jubilación ordinaria, en base a la siguiente tabla:</p><div class=\"overflow-x-auto mb-6 mt-2\"><table class=\"w-full text-sm text-left border-collapse border border-gray-300 shadow-sm\"><tbody><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">EDAD</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">54</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">55</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">56</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">57</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">58</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">59</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">60</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">61</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">62</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">63</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">64</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">65</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">66</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">67</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Reducción (h)</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">48</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">64</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">72</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">80</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">88</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">96</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">112</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">120</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">128</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">136</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">144</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">152</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">160</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">168</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Reducción (días)</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">6</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">8</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">9</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">10</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">11</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">12</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">14</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">15</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">16</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">17</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">18</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">19</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">20</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">21</td></tr></tbody></table></div><p class=\"parrafo-normal\">La presente medida tendrá carácter voluntario desde la edad de 54 años hasta los 59 años y pasará a tener carácter obligatorio a partir de los 60 años de edad. El personal que disfrute de esta reducción de jornada por edad no podrá realizar horas extraordinarias.</p><p class=\"parrafo-normal\">La persona que desee acogerse a esta medida deberá realizar la solicitud por escrito al Dpto de RRHH, debiendo calendarizar las horas de reducción junto al calendario anual y dentro del año natural en el que se cumpla la edad indicada en la anterior tabla. Una vez la persona se acoja a esta medida tendrá carácter irreversible.</p><p class=\"parrafo-normal\">Se establece junto al calendario anual la opción de poder acogerse o no a la reducción de jornada por edad, debiendo solicitar las fechas según lo regulado en el artículo 20 del presente acuerdo.</p><p class=\"parrafo-normal\">Dicha reducción se aplicará por días laborables, no pudiendo dividir en ningún caso el disfrute en horas sueltas. Para solicitar modificaciones en los días planificados, la persona deberá hacerlo con un mínimo de 7 días de antelación a su disfrute y sujeto a cupo diario.</p><p class=\"parrafo-normal\">Asimismo, a partir de 2026 se establece la posibilidad del disfrute de esta reducción de jornada en función de la edad de forma acumulada, esto es, acumulando en una bolsa las horas de reducción de jornada anual en función de la edad. El personal que decida disfrutarlo de esta forma podrá reducir las horas correspondientes al año o años siguientes, comunicándolo por escrito a la empresa antes del 15 de diciembre del año anterior. De no hacerlo se entenderá que la persona trabajadora opta por acumular de forma total la jornada, no pudiendo modificar su situación a lo largo del año en curso.</p><p class=\"parrafo-normal\">En el caso de que la persona cause baja en la empresa por cualquier motivo, a excepción de que la misma conlleve la reserva de puesto de trabajo y siempre que así lo solicite la persona interesada, las horas acumuladas en la bolsa se abonarán en la liquidación, siendo este supuesto el único en el que se podrían abonar las horas de la bolsa. En el caso del abono de las horas, el pago se realizará según las tablas salariales vigentes en el momento del disfrute.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 18. Bis. - Jubilación parcial.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 18. Bis. - Jubilación parcial.</p><p class=\"parrafo-normal\">La empresa valorará de forma individual cada solicitud de jubilación parcial realizada.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 19.- Reducción voluntaria de la jornada.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 19.- Reducción voluntaria de la jornada.</p><p class=\"parrafo-normal\">El personal con contrato indefinido a jornada completa podrá solicitar voluntariamente la reducción de jornada en dos (2) horas al día, siempre que concurra alguno de los siguientes requisitos:</p><p class=\"lista-letra\">• Personal con más de 55 años de edad: durante la vigencia de este acuerdo el personal que tenga más de 55 años podrá acogerse a esta opción. Esta posibilidad será revisada durante la vigencia del presente acuerdo para valorar la situación de cara al siguiente acuerdo.</p><p class=\"lista-letra\">• Personal con más de 25 años de antigüedad en Massimo Dutti Logistica SA: a lo largo de la vigencia de este pacto podrán acogerse a esta medida como máximo 5 personas de manera simultánea.</p><p class=\"parrafo-normal\">Las franjas horarias de aplicación de esta reducción serán:</p><div class=\"overflow-x-auto mb-6 mt-2\"><table class=\"w-full text-sm text-left border-collapse border border-gray-300 shadow-sm\"><tbody><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Turno</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Horario efectivo</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">06:00H14-:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 06:00H12-:00H</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">08:00H-17:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 10:00H-17:00H</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">09:00H-18:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 11:00H-18:00H</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">10:00H19-:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 13:00H-19:00H</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">14:00H-22:00H</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">De 16:00H-22:00H</td></tr></tbody></table></div><p class=\"parrafo-normal\">Las personas que ya estuvieran disfrutando una reducción voluntaria previa podrán adaptarse a esta regulación, renunciando a su condición anterior. La concesión estará condicionada a las necesidades organizativas y productivas.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 19. Bis.- Conversión voluntaria a jornada completa (contrato parcial de origen",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 19. Bis.- Conversión voluntaria a jornada completa (contrato parcial de origen<span style=\"color: rgb(209, 213, 219); font-size: 0.875rem;\">/ fijo discontinuo).</p><p class=\"parrafo-normal\">El personal que, en el momento de la negociación del presente acuerdo, tuviera un contrato indefinido a tiempo parcial de origen o un contrato fijo discontinuo a tiempo parcial tendrá la opción de la conversión voluntaria de su contrato de tiempo parcial a tiempo completo con efectos de enero 2026, o en su defecto, en el momento de la firma del acuerdo.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 20.- Calendario Laboral.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 20.- Calendario Laboral.</p><p class=\"parrafo-normal\">El calendario será anual e individual; incluirá los días festivos, vacaciones, horario, turno, días con reducción de jornada en los supuestos que corresponda, días blancos, horas de exceso, puentes y reducciones de jornada por edad.</p><p class=\"parrafo-normal\">La empresa y el comité de empresa tendrán de margen para acordar el calendario laboral del año siguiente, desde que salen publicados en el BOE los festivos hasta el 31 de octubre del año en curso, para así garantizar que se hará entrega de la propuesta de calendario laboral individual a cada persona trabajadora durante la primera quincena de noviembre. La persona trabajadora entregará su solicitud de vacaciones a lo largo de esta quincena y la empresa tendrá de margen hasta el 31 de diciembre para poder entregar los calendarios anuales a cada trabajador confirmando su solicitud de vacaciones si es el caso.</p><p class=\"parrafo-normal\">En el caso de que el BOE no haya publicado los festivos a 24 de octubre del año en curso, no pudiendo acordar con el comité de empresa el calendario del año siguiente, la empresa tendrá el margen de entrega del calendario personalizado a cada persona tantos días como el BOE haya retrasado la publicación de los festivos tomando como referencia el 24 de octubre, y respetando un margen de 7 días naturales para poder acordar conjuntamente el calendario de puentes, cupos y calendarios de cada persona.</p><p class=\"parrafo-normal\">Una vez determinados los períodos de vacaciones para cada año, si hubiera un día festivo entre las fechas señaladas dentro del período vacacional, se generará un exceso de horas de jornada. Se acordarán anualmente en el calendario laboral los horarios especiales en vísperas de festivos entre la Empresa y la representación legal de los trabajadores. Para el año 2026, en relación con los días 5 de enero, 2 de abril, 23 de junio, 24 de diciembre y 31 de diciembre, la empresa informará con una semana de antelación a la RLPT si es posible hacer un horario especial esos días. Para el 2027 se valorará en la negociación del calendario.</p><p class=\"parrafo-normal\">Una vez acordado el calendario anual si fuese necesario realizar alguna modificación en el transcurso del año en curso se acordará entre la Empresa y el Comité de Empresa.</p><p class=\"parrafo-normal\">Tras acordar el calendario anual, la planificación de los días disponibles se realizará en el siguiente orden bajo los cupos habilitados para ello:</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">• 1<span style=\"font-size: 0.875rem;\">&nbsp;Vacaciones.</p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdr
