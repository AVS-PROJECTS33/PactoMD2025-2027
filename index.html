  {
    "title": "Artículo 22.- Licencias y Permisos.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 22.- Licencias y Permisos.</p><div class=\"overflow-x-auto mb-6 mt-2\"><table class=\"w-full text-sm text-left border-collapse border border-gray-300 shadow-sm\"><tbody><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Primer Grado de Consanguinidad</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Padre/madre, hijo/hija, cónyuge</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Primer Grado de Afinidad</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Suegro/suegra, yerno/nuera</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Segundo Grado de Consanguinidad</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Hermano/hermana, abuelo/abuela, nieto/nieta</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Segundo Grado de Afinidad</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Cuñado/cuñada, abuelos/as de cónyuge</td></tr><tr class=\"border-b border-gray-200 hover:bg-gray-50\"><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Tercero Grado de Consanguinidad</td><td class=\"px-4 py-3 border-r border-gray-200 last:border-0\">Tio/a, sobrino/sobrina, bisabuelo/a, biznieto/biznieta</td></tr></tbody></table></div><p class=\"articulo-titulo\">Artículo 22.1. Permisos Retribuidos.</p><p class=\"parrafo-normal\">El personal adscrito a este Acuerdo, tendrá derecho, previo aviso y justificación, al disfrute de los permisos retribuidos regulados en el convenio colectivo de aplicación con las mejoras que a continuación se indican, debiendo acreditar el hecho causante y demás circunstancias que den lugar al disfrute del permiso:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">-&nbsp;Cinco dias por <u>accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario del cónyuge, pareja de hecho o parientes hasta el segundo grado por consanguineidad o afinidad</u>, incluido el familiar consanguíneo de la pareja de hecho, así como de cualquier otra persona distinta de las anteriores, que conviva con la persona trabajadora en el mismo domicilio y que requiera el cuidado efectivo de aquella.&nbsp;<span style=\"font-size: 0.875rem;\">El permiso de hospitalización, fallecimiento, o intervención de primer grado o segundo grado de consanguinidad, hasta 6 días naturales desde el hecho causante si este ha tenido lugar en otra comunidad autónoma.</p><p class=\"lista-letra\">• En el caso de la <u>hospitalización</u>, este permiso se podrá disfrutar en días laborables y alternos mientras dure el hecho causante. A este respecto, podrá presentarse un único justificante en el último día de permiso donde conste la fecha inicial de ingreso y que, a fecha del último día de permiso disfrutado, el/la familiar siga hospitalizado/a o que, si no está hospitalizado y sigue precisando reposo y cuidados, se contarán los días como naturales. En caso de que los días alternos afectaran a meses diferentes, y por tanto al pago en nómina, deberán justificarse los mismos antes del cierre del mes, para no dejar la falta pendiente; por lo que la empresa podrá solicitar a la persona justificantes individuales para cerrar la nómina.</p><p class=\"lista-letra\">• En el caso de la <u>intervención quirúrgica sin hospitalización que precise reposo domiciliario</u>: 1 día si es solo intervención sin reposo domiciliario, debiendo aportar justificante de la intervención. Si derivado de la intervención se precisa reposo domiciliario y cuidados se podrán coger hasta 5 días naturales en total, debiendo aportar justificante médico del día de la intervención y la duración del reposo y los cuidados.</p><p class=\"lista-letra\">• En el caso del <u>accidente o enfermedad graves,</u> si el familiar requiere cuidados domiciliarios por este motivo se deberá presentar el correspondiente justificante médico que acredite el hecho causante y la necesidad de reposo y cuidados. Si la enfermedad grave es prolongada y debido al mismo hecho causante, solo generará un único permiso.</p><p class=\"lista-letra\"><span style=\"font-size: 0.875rem;\"><u>Por fallecimiento del cónyuge o parientes hasta segundo grado de consanguinidad o afinidad y hermanos/as</u>: se concederán 4, 5 o 6 días naturales desde el hecho causante, dependiendo de si este ha tenido lugar en la misma provincia de residencia del trabajador o trabajadora, o en provincia limitrofe o en otra Comunidad Autónoma, respectivamente.</p><p class=\"lista-letra\"><span style=\"font-size: 0.875rem;\"><br></p><p class=\"parrafo-normal\">En caso de que el fallecimiento de padres, hijos o cónyuge fuese comunicado a la persona una vez iniciada la jornada laboral, podrá ausentarse de su puesto de forma inmediata computando dicha jornada como realizada completamente, iniciándose el permiso correspondiente el día natural siguiente.</p><p class=\"parrafo-normal\">En el caso de fallecimiento de familiares de primer grado por consanguinidad se podría disfrutar este permiso en días alternos siempre y cuando se justifique la necesidad de disfrutarlos de esta forma por motivos de gestiones de testamento derivadas del fallecimiento.</p><p class=\"lista-letra\">- <u>Por fallecimiento de parientes de segundo grado de afinidad</u>: se concederán 3, 4 o 5 días naturales desde el hecho causante, dependiendo de si este ha tenido lugar en la misma provincia de residencia del trabajador o trabajadora, o en provincia limítrofe o en otra Comunidad Autónoma, respectivamente.</p><p class=\"lista-letra\">-<u> Por fallecimiento de familiar de tercer grado de consanguinidad </u>se concederá 1 día natural.</p><p class=\"lista-letra\">- <u>Ingresos hospitalarios de familiares de primer grado de consanguinidad o afinidad:</u> cuando estos tengan carácter grave y necesiten del cuidado directo de un familiar, el personal podrá anticipar vacaciones del año siguiente en caso de que hayan agotado las vacaciones del año actual. Los días de permiso retribuido que se causen por hospitalización se podrán coger de forma discontinua mientras dure la hospitalización del familiar.</p><p class=\"lista-letra\">- <u>Por matrimonio o establecimiento de pareja de hecho</u> debidamente inscrita en los registros oficiales habilitados del personal, 18 días naturales. Este permiso podrá cogerse siempre que dentro de este período de 16 días esté incluido el del hecho causante. La persona trabajadora deberá justificar el hecho con copia del libro de familia o certificado de matrimonio.</p><p class=\"lista-letra\">- <u>Por boda de familiares de primer grado de consanguinidad o afinidad y hermanos/as</u>: 1 día natural si el hecho causante es dentro de la Comunidad Autónoma o 3 días naturales si es fuera de la misma, a contar desde el hecho causante. El personal del turno que presta servicios la noche del domingo al lunes podrá disfrutar este permiso la noche del domingo al lunes cuando el evento tenga lugar en domingo.</p><p class=\"lista-letra\">- <u>Consultas médicas</u>: Tiempo indispensable para consultas médicas para el propio personal, presentando justificante con hora de entrada y hora de salida.</p><p class=\"lista-letra\">- <u>Horas de acompañamiento:</u> 25 horas anuales retribuidas para acompañamiento de familiares de primer grado de consanguinidad o afinidad para consultas médicas y tutorías escolares. El disfrute será de 35 horas anuales retribuidas para acompañamiento de hijos/hijas con una discapacidad igual o superior al 33% a consultas médicas y tutorías escolares.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;Por cada hijo/a a partir del segundo/a, contando este, esta bolsa se incrementará en 10 horas anuales más por cada hijo/a y así sucesivamente.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;Este permiso deberá ser preavisado con una antelación de 7 días al Dpto de RRHH presentando justificante-citación y posteriormente justificante de&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;asistencia indicando hora de entrada y de salida. Se excluyen del preaviso aquellos casos de carácter urgente. El tiempo de disfrute de este permiso&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;será el necesario en acudir a la citación y regresar al puesto de trabajo, por lo que el desplazamiento se deberá justificar y entrará dentro de las horas&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;de acompañamiento según los tiempos de desplazamiento especificados en el presente pacto Las consultas médicas de la persona trabajadora de&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;seguros de salud privados se incluirán en esta bolsa de horas de acompañamiento, exceptuándose las relativas a la medicina estética, que no se&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;considerarán en ningún caso permiso retribuido.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;Asimismo, podrán utilizarse las horas de esta bolsa para la asistencia del personal a las reuniones informativas convocadas por el colegio relacionadas&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;con cuestiones pedagógicas o educativas del/ de la menor, así como para la renovación del DNI y del pasaporte de los hijos/as menores de edad, las&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;gestiones de la propia persona trabajadora para la renovación del DNI Y pasaportes propios.</p><p class=\"lista-letra\"><u>• Visitas médicas turno noche:</u> Cuando la persona que preste servicios en el turno que tiene calendada la noche y tenga una consulta médica de especialista al día siguiente en la Seguridad Social entre las 8:00 y las 11:00 horas de la mañana del lunes, podrá ausentarse hasta 3 horas antes de la salida de su turno en función de la hora de la consulta.</p><p class=\"lista-letra\"><u>• Tiempos de desplazamiento:</u> En relación con las consultas médicas propias y la bolsa de acompañamiento recogidas en el punto V. de este artículo, se acuerdan los siguientes tiempos de desplazamiento:</p><p class=\"lista-letra\"><br></p><p class=\"parrafo-normal\"><span style=\"font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<span style=\"font-size: 0.875rem; color: rgb(156, 163, 175);\">•<span style=\"font-size: 0.875rem;\">&nbsp;Dentro de la localidad del centro de trabajo (Tordera): hasta 20 minutos.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;•<span style=\"font-size: 0.875rem;\">&nbsp;Menos de 16 km desde el centro de trabajo (Tordera): hasta 30 minutos.&nbsp;</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;•<span style=\"font-size: 0.875rem;\">&nbsp;Más de 16 km desde el centro de trabajo (Tordera):</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;Visita médica propia: hasta 1,5 minutos el km. desde el centro de trabajo hasta el centro médico.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">•&nbsp;<span style=\"font-size: 0.875rem;\">Acompañamiento: hay que sumar los km desde el centro de trabajo al centro médico, sin tener en cuenta el domicilio de la persona,&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; computando 2 minutos por kilómetro para el cálculo del desplazamiento.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;En los casos en que la persona finalice su permiso retribuido y quedando menos de una hora para finalizar su jornada decida no reincorporarse,&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;puede escoger entre las siguientes opciones:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;•&nbsp;Justificar ese tiempo con permiso no retribuido, y este tiempo no entrará en el cómputo de las primeras 8 horas sin cupo del permiso no&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; retribuido.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;A cargo de la compensación de horas extraordinarias o horas de exceso (no entrar la bolsa negativa pues tiene una compensación diferente)&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; previa petición de la persona a la hora de adjuntar el justificante.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; •&nbsp;En el caso de que la persona no lo especifique, se aplicará por defecto el descuento con permiso no retribuido.</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <u>• Permiso de Mudanza</u>: Por cambio de domicilio habitual: 2 días laborables. El plazo máximo para poder disfrutar este permiso es de 1 mes desde el&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;hecho causante y deberá justificarse con el empadronamiento, el contrato de alquiler o la firma de la hipoteca, según corresponda.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<u>• Cumplimiento deber público:</u> El tiempo indispensable para el cumplimiento de un deber inexcusable de carácter público y personal, comprendido el&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;ejercicio del sufragio activo, en las condiciones establecidas en la letra d) del número 3 del&nbsp;<span style=\"color: rgb(249, 250, 251); font-size: 0.875rem;\">articulo 37 del Estatuto de los Trabajadores.</p><p class=\"lista-letra\" style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\"><u style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">• Técnicas de reproducción asistida</u>: Por el tiempo indispensable para la asistencia médica con motivo de un tratamiento de reproducción asistida.</p><p class=\"lista-letra\" style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\"><u style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">• Permiso de exámenes</u>: Las horas precisas para asegurar la concurrencia a exámenes finales de los trabajadores, cuando estos cursen estudios de carácter oficial y académico.</p><p class=\"lista-letra\" style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\"><u style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">• Catástrofe o fenómeno meteorológico grave</u>: Hasta cuatro días por imposibilidad de acceder al centro de trabajo o transitar por las vías de circulación necesarias para acudir al mismo, como consecuencia de las recomendaciones, limitaciones o prohibiciones al desplazamiento establecidas por las autoridades competentes, así como cuando concurra una situación de riesgo grave e inminente, incluidas las derivadas de una catástrofe o fenómeno meteorológico adverso. <span style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; color: rgb(209, 213, 219); font-size: 0.875rem;\">Transcurridos los cuatro días, el permiso se prolongará hasta que desaparezcan las circunstancias que lo justificaron, sin perjuicio de la posibilidad de la empresa de aplicar una suspensión del contrato de trabajo o una reducción de jornada derivada de fuerza mayor en los términos previstos en el artículo 47.6 del ET.</p><p class=\"lista-letra\" style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\"><span style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; color: rgb(209, 213, 219); font-size: 0.875rem;\">A este respecto se deberá presentar la correspondiente justificación, para lo que será válido el justificante emitido por cualquier cuerpo de seguridad oficial (policía local, Mossos de Escuadra, etc) o un organismo oficial (Ayuntamiento, Diputación, etc). En el caso de que la persona reciba una alerta meteorológica en el teléfono móvil por la autoridad competente para ello, debe diferenciarse si el mensaje indica una simple recomendación o si se trata de una alerta extrema que no permite salir del hogar.</p><p class=\"lista-letra\" style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\"><span style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; color: rgb(209, 213, 219); font-size: 0.875rem;\"><br></p><p class=\"parrafo-normal\" style=\"--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ;\">Para todos los casos, se establece un plazo máximo de entrega de los justificantes de 3 días laborables tras el hecho causante, si pasado ese plazo no se dispone de justificación del mismo, se considerará falta sin justificar.</p><p class=\"parrafo-normal\"><br></p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 23.- Excedencias.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 23.- Excedencias.</p><p class=\"parrafo-normal\">El personal adscrito a este Acuerdo podrá acogerse a las excedencias reguladas en el convenio colectivo de aplicación con las mejoras que a continuación se indican.</p><p class=\"articulo-titulo\">Artículo 23.1.- Excedencia por motivos familiares.</p><p class=\"parrafo-normal\">Las personas tendrán derecho a un periodo de excedencia de duración no superior a cuatro años para atender al cuidado de cada hijo/ hija, tanto cuando lo sea por naturaleza como por adopción, o en los supuestos de acogimiento, tanto permanente como preadoptivo, aunque éstos sean provisionales, a contar desde la fecha de nacimiento o, en su caso, de la resolución judicial o administrativa, con reserva del puesto de trabajo durante los dos primeros años.</p><p class=\"parrafo-normal\">También tendrán derecho a un periodo de excedencia, de duración no superior a cuatro años, las personas para atender al cuidado de un familiar hasta el segundo grado de consanguinidad $y/o$ afinidad, que por razones de edad, accidente, enfermedad o discapacidad no pueda valerse por sí mismo y no desempeñe actividad retribuida, con reserva del puesto de trabajo durante los dos primeros años.</p><p class=\"parrafo-normal\">Si dos o más personas generasen este derecho por el mismo hecho causante, la empresa podrá limitar el ejercicio simultáneo por razones justificadas de funcionamiento.</p><p class=\"parrafo-normal\">En ambos casos, el periodo que permanezca en esta situación será computable a efectos de antigüedad y tendrá derecho a la asistencia a cursos de formación profesional relativos al puesto que venía desempeñando, especialmente con ocasión de su reincorporación.</p><p class=\"parrafo-normal\">Si la persona que pide la excedencia así lo manifiesta, y con el objetivo de que continúe durante el tiempo de suspensión vinculado con el centro de trabajo, podrá solicitar a la empresa que le remita las publicaciones internas del mismo, así como información de interés de la empresa.</p><p class=\"articulo-titulo\">Artículo 23.2.- Excedencia Voluntaria.</p><p class=\"parrafo-normal\">Se establece una excedencia voluntaria, para personas con antigüedad en la empresa superior a un año, por un período mínimo de 1 mes y máximo de 5 años. Pudiendo solicitar excedencia a partir de 15 días siempre que no coincida con los periodos de no escolarización, solicitándose en el momento del calendario anual.</p><p class=\"parrafo-normal\">Si la duración de la misma es de hasta 1 mes, la persona que se acoja a ella con esta duración tendrá derecho a reserva del puesto de trabajo durante su totalidad sin cobertura de vacante, salvo por contrato de interinidad, y la reincorporación será automática siempre que no haya prestado servicios para otra empresa, en cuyo caso no habrá reserva de puesto de trabajo ni, por lo tanto, reincorporación automática. Será requisito indispensable la presentación de la vida laboral actualizada para acreditar que no se prestó servicios efectivos en otra empresa durante el mes de excedencia, puesto que si se han prestado servicios en otra empresa no operará la reserva del puesto de trabajo regulada en el presente artículo.</p><p class=\"articulo-titulo\">Artículo 23.3.- Excedencia por Estudios.</p><p class=\"parrafo-normal\">Se establece una excedencia especial por estudios, para el personal que tenga al menos un año de antigüedad en la empresa, para la realización de estudios de nivel ESO, Bachiller, Grado medio o superior o estudios universitarios, de duración no inferior a cuatro meses y con período máximo de cuatro años. Este tiempo no computará a efectos de antigüedad.</p><p class=\"parrafo-normal\">El personal que se acoja a esta excedencia tendrá derecho a reserva de puesto de trabajo durante el período máximo de un año. El personal deberá aportar documentación que acredite la realización de dichos estudios, donde se certifique que existe un buen aprovechamiento del mismo. En caso contrario, perderá el derecho de reserva del puesto de trabajo. Asimismo, presentará un informe de vida laboral actualizado en el que conste que no ha realizado ningún trabajo en el periodo de excedencia, en caso contrario perderá el derecho de reserva del puesto de trabajo, considerándose una excedencia voluntaria sin reserva de puesto de trabajo.</p><p class=\"articulo-titulo\">Artículo 23.4.- Excedencia por voluntariado social.</p><p class=\"parrafo-normal\">Se establece una excedencia especial para la realización de actividades de voluntariado social para personas con contrato indefinido. La persona que haga uso de dicha excedencia deberá presentar justificante de la ONG o entidad vinculada con la actividad, así como acreditar los desplazamientos a los lugares en los que va a realizar el voluntariado, si fuese el caso por ejemplo las tarjetas de embarque de ida y vuelta de los vuelos o desplazamientos. La duración de esta excedencia no podrá ser inferior a 6 meses ni superior a 1 año, no computa a efectos de antigüedad y la persona que se acoja a ella tendrá derecho a la reserva del puesto de trabajo durante su totalidad sin cobertura de vacante, salvo por contrato de interinidad. Asimismo, presentará un informe de vida laboral actualizado en el que conste que no ha realizado ningún trabajo en el periodo de excedencia, en caso contrario perderá el derecho de reserva del puesto de trabajo, considerándose una excedencia voluntaria sin reserva de puesto de trabajo.</p><p class=\"parrafo-normal\">Si tres o más personas generasen este derecho por el mismo motivo, la empresa podrá limitar el ejercicio simultáneo por razones justificadas de funcionamiento.</p><p class=\"articulo-titulo\">Artículo 23.5.- Excedencia por vacaciones escolares de hijo/hija menor de edad.</p><p class=\"parrafo-normal\">Con motivo de las vacaciones escolares de un/una hijo/hija menor de 12 años que se encuentre cursando estudios de carácter obligatorio, el personal podrá solicitar una excedencia voluntaria por tal motivo por un periodo mínimo de 15 días y máximo de 2 meses. Esta excedencia no computa a efectos de antigüedad y la persona que se acoja a ella tendrá derecho a reserva del puesto de trabajo durante su totalidad sin cobertura de vacante salvo por contrato de interinidad. Asimismo, presentará un informe de vida laboral actualizado en el que conste que no ha realizado ningún trabajo en el periodo de excedencia, en caso contrario perderá el derecho de reserva del puesto de trabajo, considerándose una excedencia voluntaria sin reserva de puesto de trabajo.</p><p class=\"parrafo-normal\">Para el disfrute de esta excedencia la empresa y la representación social regularán los cupos, que se irán actualizando anualmente.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 24.- Adaptación del turno de trabajo por estudios.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 24.- Adaptación del turno de trabajo por estudios.</p><p class=\"parrafo-normal\">Las personas por motivos de la realización de estudios oficiales (Bachillerato, Diplomatura, Licenciatura, Grado Medio o superior, o Escuela oficial idiomas) donde sea obligatoria la asistencia a clase, podrán elegir turno de trabajo en los términos regulados en el artículo 23 del Estatuto de los Trabajadores. Será obligatorio entregar al Dpto. de RRHH un justificante de la matrícula siempre que organizativa y productivamente sea posible.</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
  },
  {
    "title": "Artículo 25.-. Conciliación Vida Laboral y Familiar.",
    "contentHtml": "\n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            \n                            <p class=\"articulo-titulo\">Artículo 25.-. Conciliación Vida Laboral y Familiar.</p><p class=\"articulo-titulo\">Artículo 25.1.- Permiso por nacimiento de hijo/hija.</p><p class=\"parrafo-normal\">En lo que al permiso por nacimiento de menor se refiere, se estará a lo regulado en el Estatuto de los Trabajadores y en el convenio colectivo de aplicación.</p><p class=\"parrafo-normal\">En los supuestos del nacimiento de un menor con una discapacidad igual o superior al 33% se estará a lo dispuesto en el artículo 48.6 del Estatuto de los Trabajadores, en cuanto a la duración de la suspensión del contrato.</p><p class=\"parrafo-normal\">Las personas trabajadoras tendrán derecho a ausentarse del trabajo durante una hora en el caso de nacimiento prematuro de hijo o hija, o que, por cualquier causa, deban permanecer hospitalizados a continuación del parto. Asimismo, tendrán derecho a reducir su jornada de trabajo hasta un máximo de dos horas, con la disminución proporcional del salario. Para el disfrute de este permiso se seguirá lo establecido legalmente para el disfrute de una reducción de jornada por guarda legal.</p><p class=\"articulo-titulo\">Artículo 25.2.- Permiso de cuidado del menor lactante.</p><p class=\"parrafo-normal\">Por cuidado de un hijo-hija menor de doce meses, tendrá derecho a una hora de ausencia al trabajo que podrá dividir en dos fracciones. La persona, por su voluntad, podrá sustituir este derecho por una reducción de su jornada en una hora, en caso de parto múltiple la duración del permiso se incrementará proporcionalmente con la misma finalidad. Se podrá optar entre hacer uso de esa licencia de la forma indicada o acumular el tiempo resultante de esa licencia y disfrutarlo tras la misma, en este caso serán 22 días laborables (44 laborables en el caso de partos gemelares).</p><p class=\"parrafo-normal\">No obstante lo anterior, quien ejerza este derecho, por su voluntad, podrá sustituirlo por una reducción de su jornada en media hora con la misma finalidad. La reducción de jornada contemplada en este apartado constituye un derecho individual de las personas trabajadoras sin que pueda transferirse su ejercicio al otro progenitor, adoptante, guardador o acogedor. No obstante, si dos personas trabajadoras de la misma empresa ejercen este derecho por el mismo sujeto causante, la dirección empresarial podrá limitar su ejercicio simultáneo por razones justificadas de funcionamiento de la empresa, que deberá comunicar por escrito.</p><p class=\"parrafo-normal\">Cuando ambos progenitores, adoptantes, guardadores o acogedores ejerzan este derecho con la misma duración y régimen, el periodo de disfrute podrá extenderse hasta que el lactante cumpla doce meses, con reducción proporcional del salario a partir del cumplimiento de los nueve meses.</p><p class=\"articulo-titulo\">Artículo 25.3.- Reducción de Jornada por guarda legal</p><p class=\"parrafo-normal\">El personal con hijos/hijas menores de 12 años que quiera acogerse a una reducción de jornada por guarda legal lo hará en los términos establecidos legal y convencionalmente.</p><p class=\"parrafo-normal\">Tendrá el mismo derecho quien precise encargarse del cuidado directo de un familiar, hasta el segundo grado de consanguinidad o afinidad, que por razones de edad, accidente o enfermedad no pueda valerse por sí mismo, y que no desempeñe actividad retribuida.</p><p class=\"parrafo-normal\">Si dos o más trabajadores/as de la misma empresa generasen este derecho por el mismo sujeto causante, el empresario podrá limitar su ejercicio simultáneo por razones justificadas de funcionamiento de la empresa.</p><p class=\"parrafo-normal\">La empresa, de apreciar que el número de solicitudes se incrementa hasta el punto de ver un problema operativo de organización, trataría el horario de cada trabajador/a de forma individual.</p><p class=\"parrafo-normal\">Para los cambios de jornada por cuidado de hijo/hija recogidos en el presente artículo, se establece que la persona trabajadora realice la solicitud con 15 dias de preaviso. En este caso el plazo de respuesta por parte de la empresa será como máximo de 7 días.</p><p class=\"parrafo-normal\">A la hora de solicitar una reducción de jornada por guarda legal, esta debe solicitarse dentro de la jornada de origen de la persona trabajadora.</p><p class=\"articulo-titulo\">Artículo 25.4.- Concentración/acumulación de la reducción de jornada (No cole).</p><p class=\"parrafo-normal\">Dentro del año natural en curso, el personal que disfrute de una reducción de jornada por cuidado de un menor podrá acumular dicha reducción en periodos de no escolarización del/de la menor. El período máximo a acumular será el equivalente a dos semanas laborables de la persona trabajadora, que podrán disfrutarse juntas o separadas, y deberán solicitarse en el momento de la planificación del calendario anual.</p><p class=\"parrafo-normal\">Si bien dependerá del cupo anual por sección acordado; para el caso de que una sección no agote el cupo asignado, se valorará ceder éste a otra sección siempre que sea posible organizativa y productivamente. En tal caso, la empresa valorará individualmente cada solicitud con el/la trabajador/trabajadora que lo solicite. Asimismo, la Empresa ajustará el calendario laboral del/de la solicitante, en el momento de la entrega del calendario laboral, para cumplir con la jornada anual pactada con cada trabajador/trabajadora.</p><p class=\"parrafo-normal\">Tanto para el disfrute y la recuperación de las horas, la persona deberá permanecer en situación de reducción de jornada por cuidado del/la menor.</p><p class=\"parrafo-normal\">En el caso de que en los periodos de descanso $y/o$ recuperación de las horas de concentración/acumulación de la jornada, si coincide un periodo de baja por IT/AT se procederá a replanificar la recuperación o descanso en otro periodo acordado entre empresa y trabajador/a siempre dentro del calendario anual correspondiente. Si no fuese posible la replanificación de las horas, se procedería al descuento de las mismas en la nómina de enero del siguiente año.</p><p class=\"parrafo-normal\">La acumulación/concentración de jornada debe reflejarse en el calendario laboral anual.</p><p class=\"parrafo-normal\">Para el caso de que las solicitudes de varias personas trabajadoras sean coincidentes, se estará lo que se establece a continuación:</p><p class=\"parrafo-normal\"><span style=\"color: rgb(156, 163, 175); font-size: 0.875rem;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;•&nbsp;En el caso de que el período solicitado esté completo, tendrán preferencia para el disfrute del mismo las personas que no lo hayan disfrutado el año&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;anterior. Para el primer año de disfrute de esta concentración/acumulación, en el caso de que dos o más personas soliciten la misma fecha, la&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;concesión se haría a la persona de mayor antigüedad en la empresa.</p><p class=\"lista-letra\">• Si continúa habiendo discrepancia, tendrán preferencia las personas que no lo hayan disfrutado en los dos últimos años, y así sucesivamente.</p><p class=\"lista-letra\">• En el caso de que el turno solicitado esté completo y no exista coincidencia con años anteriores, se procederá a asignar a la persona con mayor antigüedad en la empresa.</p><p class=\"parrafo-normal\">Las personas que se acojan a esta medida podrán escoger recuperar las horas de dos maneras:</p><p class=\"lista-numero\">1. Planificación junto con el calendario de vacaciones: la recuperación se planificará en el calendario de la persona al inicio del año en curso, recuperando dichas horas en el segundo semestre del año, dentro del turno habitual de la persona, en fracciones de 1h/día y sin poder realizar modificaciones en el año en curso.</p><p class=\"lista-numero\">2. Recuperación sujeta a petición de la empresa: en este caso la recuperación será dentro de la jornada diaria no superando las 9,5h al día. Esta recuperación podrá hacerse tanto al inicio como al final de la jornada diaria planificada (independientemente del turno) y durante todo el año siempre y cuando haya producción, garantizando la recuperación de todas las horas antes del 30 de septiembre. Si llegada esa fecha la persona no ha recuperado las horas realizadas, la empresa calendará esas horas o bien se acordará con la persona, teniendo obligación de recuperarlas dentro de su turno de trabajo, antes de que acabe el año en curso.</p><p class=\"parrafo-normal\">&nbsp; &nbsp; &nbsp; En los supuestos en que la persona tenga pendiente de recuperación bolsa negativa de horas, tendrá prioridad en la recuperación la bolsa de horas a&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; cargo de empresa, en segundo lugar la recuperación de horas de no cole, y por último la bolsa negativa a cargo del trabajador/a.</p><p class=\"parrafo-normal\">El personal que se incorpore de una baja por nacimiento de hijo/hija en el año natural y solicite una reducción de jornada con este tipo de acumulación podrá hacerlo independientemente del mes de su incorporación, siempre y cuando esto respete los cupos acordados entre la empresa y el comité de empresa. En el caso de que, por los cupos, no sea posible se estudiará el caso individualmente.</p><p class=\"parrafo-normal\">La empresa anualmente informará de los días en que se podrán planificar las horas que se dejan de realizar con motivo de la acumulación de la concreción de reducción de jornada, estos días se verán modificados anualmente según las necesidades organizativas y productivas de la empresa. En el Calendario laboral se informará de estos días disponibles y la persona trabajadora deberá realizar la solicitud de recuperación de las horas junto con las vacaciones anuales, pudiendo alargar su horario habitual en jornadas de 1 hora al día.</p><p class=\"parrafo-normal\">No se aceptarán solicitudes entregadas fuera de plazo y que no queden reguladas en este artículo.</p><p class=\"parrafo-normal\">La empresa de forma anual hará entrega a la RLPT de la asignación del no cole: fechas confirmadas, personas, rechazos y si se ha cedido cupo de otras secciones.</p><p class=\"articulo-titulo\">Artículo 25.5.- Jornada Flexible. Concreción Horaria</p><p class=\"parrafo-normal\">El personal que por motivos relacionados con la conciliación de la vida familiar y laboral precise un ajuste en su horario habitual de trabajo, deberá solicitarlo a la empresa.</p><p class=\"parrafo-normal\">Dichos ajustes deberán ser razonables y proporcionados en relación con las necesidades de la persona trabajadora y con las necesidades organizativas o productivas de la empresa, así como deben tener carácter temporal. Las personas trabajadoras tienen derecho a efectuar dicha solicitud hasta que los hijos o hijas cumplan 12 años.</p><p class=\"parrafo-normal\">En los casos en los que la persona solicite cambio del horario de conciliación, con o sin reducción por guarda legal, la empresa podrá solicitar una justificación demostrable para el cambio y analizará la viabilidad de la solicitud.</p><p class=\"articulo-titulo\">Artículo 25.6.- Distribución irregular por custodia compartida.</p><p class=\"parrafo-normal\">Las personas que a través de Sentencia Judicial firme justifiquen a la empresa la custodia compartida de su hijo o hija (hijos o hijas) siempre que sean menores de 12 años, podrán solicitar a la empresa la distribución de su jornada anual en función de las semanas que tenga que atender al cuidado del menor. Para ello, se deberá entregar al departamento de RRHH un escrito con la solicitud realizando una propuesta de planificación de acumulación anual de jornada, que será valorada por la empresa y la aceptación o no de la solicitud dependerá del número de solicitudes y de las posibilidades organizativas y productivas. La empresa contestará por escrito con la aceptación o no. En el caso que la respuesta sea negativa, la empresa argumentará los motivos.</p><p class=\"articulo-titulo\">Artículo 25.7.- Distribución horaria por custodia monoparental.</p><p class=\"parrafo-normal\">El personal que tenga la condición de familia monoparental debido a que una sentencia judicial firme le otorga en exclusiva la guarda y custodia del menor/menores de 12 años o bien por su situación de viudez con hijos/hijas menores de 12 años, podrán solicitar a la empresa la elección del turno de trabajo en función del cuidado del menor fuera del horario escolar. Para ello entregará al departamento de RRHH un escrito con la solicitud realizando una propuesta de adaptación de su horario, que será valorada por la empresa y aceptada dependiendo del $n^{\\circ}$ de solicitudes y de las posibilidades organizativas. La empresa contestará por escrito con la aceptación o no. En el caso de que la respuesta sea negativa, la empresa argumentará los motivos.</p><p class=\"articulo-titulo\">Artículo 25.8.- Bolsa de horas para el personal con reducción de jornada por guarda</p><p class=\"parrafo-normal\">legal.</p><p class=\"parrafo-normal\">Se acuerda crear una bolsa de horas de un máximo de 25 horas anuales para las personas con reducción de jornada donde se establece que la persona pueda realizar como máximo 1 hora sobre su jornada el día que haya una necesidad productiva en el centro. Estas horas realizadas por motivos productivos sólo se podrán compensar en tiempo de descanso con un preaviso de 7 días, pudiendo disfrutarlos en fracciones mínimas de 1 hora.</p><p class=\"parrafo-normal\">Esta medida será de aplicación hasta la finalización de la vigencia del actual pacto de empresa, donde se valorará y estudiará el impacto de dicha medida y la continuidad de la misma.</p><p class=\"parrafo-normal\">La compensación de dichas horas se realizará a razón de 1,75 horas por cada hora realizada según lo recogido en el artículo 10.1 del presente acuerdo</p><p class=\"articulo-titulo\">Artículo 25.8 Bis. - Bolsa de horas para fines de semana del personal con reducción</p><p class=\"parrafo-normal\">de jornada por guarda legal.</p><p class=\"parrafo-normal\">Se acuerda crear una bolsa de horas para días festivos y fines de semana de un máximo de 18 horas anuales para las personas con reducción de jornada. Esta bolsa de horas es independiente a la actual bolsa para el personal con reducción.</p><p class=\"parrafo-normal\">La compensación de dichas horas se realizará a razón de 1,75 horas por cada hora realizada según lo recogido en el artículo 10.1 del presente acuerdo</p>\n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        \n                        "
